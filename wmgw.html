<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Physics Lab V2 - EM & Gravitational Waves</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000814;
    font-family:Arial;
    color:white;
}

canvas{ display:block; }

#ui{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,0.6);
    padding:12px;
    border-radius:10px;
    z-index:10;
}

button{
    margin:4px;
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
    <button onclick="mode='em'">EM Waves</button>
    <button onclick="mode='gw'">Gravitational Waves</button>
    <button onclick="waves=[]">Clear</button>
</div>

<canvas id="c"></canvas>

<script>

const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
    c.width = innerWidth;
    c.height = innerHeight;
}
resize();
addEventListener("resize",resize);

// -------------------- CONSTANTS --------------------
const c_light = 3e8;     // scaled visually
let t = 0;
let mode = "em";
let waves = [];

// scale down physics
const SCALE = 2e-6;

// -------------------- SUN --------------------
const sun = {
    x:0,
    y:0
};

function updateSun(){
    sun.x = c.width/2;
    sun.y = c.height/2;
}

// -------------------- EARTH --------------------
const earth = {
    x:0,
    y:0,
    r:18,
    dragging:false
};

earth.x = 600;
earth.y = 300;

// -------------------- MOUSE DRAG --------------------
addEventListener("mousedown",(e)=>{
    let dx=e.clientX-earth.x;
    let dy=e.clientY-earth.y;
    if(Math.hypot(dx,dy)<earth.r){
        earth.dragging=true;
    }
});

addEventListener("mouseup",()=>earth.dragging=false);

addEventListener("mousemove",(e)=>{
    if(earth.dragging){
        earth.x=e.clientX;
        earth.y=e.clientY;
    }
});

// -------------------- WAVES --------------------
function emitWave(){
    waves.push({
        t0:t
    });
}

setInterval(emitWave,1200);

// -------------------- EM FIELD --------------------
function EM(r, t0){
    let t_ = (t - t0);

    let k = 0.02;
    let w = 0.02 * c_light * SCALE;

    return (1/(1+r*0.01)) * Math.sin(k*r - w*t_);
}

// -------------------- GW STRAIN --------------------
function GW(r, t0){
    let t_ = (t - t0);

    let k = 0.02;
    let w = 0.015 * c_light * SCALE;

    return (1/(1+r*0.008)) * Math.sin(k*r - w*t_);
}

// -------------------- GRID --------------------
function drawGrid(){

    const step = 30;

    for(let x=0;x<c.width;x+=step){
        ctx.beginPath();

        for(let y=0;y<c.height;y+=6){

            let dx = x - sun.x;
            let dy = y - sun.y;
            let r = Math.hypot(dx,dy);

            let offset = 0;

            if(mode==="gw"){
                for(let wv of waves){
                    let h = GW(r, wv.t0);
                    offset += h * 25;
                }
            }

            ctx.lineTo(x + offset, y);
        }

        ctx.strokeStyle="rgba(120,160,255,0.25)";
        ctx.stroke();
    }
}

// -------------------- EM RINGS --------------------
function drawEM(){

    for(let wv of waves){

        let age = (t - wv.t0);
        let radius = age * 2;

        ctx.beginPath();
        ctx.arc(sun.x,sun.y,radius,0,Math.PI*2);

        ctx.strokeStyle = "rgba(0,200,255,0.6)";
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

// -------------------- DETECTION --------------------
function detectAtEarth(){

    let signal = 0;

    for(let wv of waves){
        let dx = earth.x - sun.x;
        let dy = earth.y - sun.y;
        let r = Math.hypot(dx,dy);

        if(mode==="em"){
            signal += EM(r, wv.t0);
        }else{
            signal += GW(r, wv.t0);
        }
    }

    ctx.fillStyle="white";
    ctx.fillText("Detector Signal: " + signal.toFixed(4), 20, c.height-20);
}

// -------------------- DRAW OBJECTS --------------------
function drawBodies(){

    // SUN
    ctx.beginPath();
    ctx.arc(sun.x,sun.y,40,0,Math.PI*2);
    ctx.fillStyle="yellow";
    ctx.fill();

    // EARTH
    ctx.beginPath();
    ctx.arc(earth.x,earth.y,earth.r,0,Math.PI*2);
    ctx.fillStyle="blue";
    ctx.fill();
}

// -------------------- LOOP --------------------
function animate(){

    t += 1;

    ctx.clearRect(0,0,c.width,c.height);

    updateSun();

    drawGrid();

    if(mode==="em") drawEM();

    drawBodies();

    detectAtEarth();

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
