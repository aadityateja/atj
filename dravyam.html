<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRAVYA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    overflow:hidden;
    background:
    radial-gradient(circle at center,
    #06111f 0%,
    #02070f 40%,
    #000000 100%);
    color:white;
}

#canvas{
    position:fixed;
    inset:0;
}

#title{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:10;
}

#title h1{
    font-size:3rem;
    letter-spacing:8px;
    color:#7fe7ff;
}

#title p{
    opacity:.8;
}

#clock{
    position:absolute;
    right:20px;
    top:20px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
    padding:10px 15px;
    border:1px solid #3fb8ff;
    border-radius:12px;
    z-index:10;
}

.node{
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;

    background:rgba(0,150,255,.08);
    border:1px solid rgba(127,231,255,.4);

    backdrop-filter:blur(5px);

    transition:.3s;
}

.node:hover{
    transform:scale(1.1);
    box-shadow:0 0 25px #49cfff;
}

#origins{
    top:15%;
    left:20%;
}

#matter{
    top:60%;
    left:15%;
}

#energy{
    top:20%;
    right:20%;
}

#time{
    top:60%;
    right:15%;
}

#forward{
    bottom:8%;
    left:50%;
    transform:translateX(-50%);
}

#lore{
    position:absolute;
    bottom:20px;
    right:20px;
    width:320px;
    min-height:150px;

    background:rgba(0,0,0,.45);
    backdrop-filter:blur(12px);

    border:1px solid #3fb8ff;
    border-radius:15px;

    padding:15px;

    z-index:10;
}

#lore h3{
    color:#7fe7ff;
    margin-bottom:10px;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="title">
    <h1>DRAVYA</h1>
    <p>A Realm Where Curiosity Shapes Spacetime</p>
</div>

<div id="clock"></div>

<div class="node" id="origins">Origins</div>
<div class="node" id="matter">Matter</div>
<div class="node" id="energy">Energy</div>
<div class="node" id="time">Time</div>
<div class="node" id="forward">Forward Realm</div>

<div id="lore">
<h3>Lotus of Uncertainty</h3>
<p>
The Lotus exists and does not exist.
Every observer reports a different truth.
</p>
</div>

<script>

const lore = document.getElementById("lore");

const data = {

Origins: `
<h3>Institute of Origins</h3>
<p>
Study of the first stars, cosmic dawn,
dark matter, and galaxy formation.
</p>`,

Matter: `
<h3>Institute of Matter</h3>
<p>
Particle collisions, detectors,
quarks, gluons, and the Higgs field.
</p>`,

Energy: `
<h3>Institute of Energy</h3>
<p>
Nuclear fission, fusion,
reactor science, and future power.
</p>`,

Time: `
<h3>Tower of Time</h3>
<p>
Atomic clocks synchronize
all regions of DRAVYA.
</p>`,

"Forward Realm": `
<h3>Forward Realm</h3>
<p>
Inspired by forward detectors.
The smallest signals often carry
the greatest mysteries.
</p>`
};

document.querySelectorAll(".node").forEach(node=>{

node.onclick=()=>{
    lore.innerHTML=data[node.innerText];
};

});

function updateClock(){

const now=new Date();

clock.innerHTML=
now.toLocaleTimeString();

}

setInterval(updateClock,1000);
updateClock();

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const particles=[];

for(let i=0;i<180;i++){

particles.push({

x:Math.random()*innerWidth,
y:Math.random()*innerHeight,

vx:(Math.random()-.5)*0.4,
vy:(Math.random()-.5)*0.4,

r:Math.random()*2+1

});

}

let t=0;

function draw(){

requestAnimationFrame(draw);

t+=0.01;

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0)p.x=canvas.width;
if(p.x>canvas.width)p.x=0;

if(p.y<0)p.y=canvas.height;
if(p.y>canvas.height)p.y=0;

ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(127,231,255,.8)";
ctx.fill();

});

const cx=canvas.width/2;
const cy=canvas.height/2;

const pulse=
50+
Math.sin(t*3)*8;

ctx.beginPath();
ctx.arc(cx,cy,pulse,0,Math.PI*2);

ctx.fillStyle="rgba(0,180,255,.25)";
ctx.fill();

ctx.beginPath();
ctx.arc(cx,cy,20,0,Math.PI*2);

ctx.fillStyle="#7fe7ff";
ctx.fill();

ctx.shadowBlur=30;
ctx.shadowColor="#7fe7ff";

for(let i=0;i<10;i++){

const angle=(Math.PI*2/10)*i+t;

const x=
cx+
Math.cos(angle)*160;

const y=
cy+
Math.sin(angle)*160;

ctx.beginPath();
ctx.moveTo(x,y-18);
ctx.lineTo(x+12,y);
ctx.lineTo(x,y+18);
ctx.lineTo(x-12,y);
ctx.closePath();

ctx.fillStyle="#59d9ff";
ctx.fill();
}

ctx.shadowBlur=0;

const lotusX=
cx+
Math.cos(t*.5)*250;

const lotusY=
cy-180+
Math.sin(t*.8)*30;

ctx.font="60px serif";
ctx.fillText("🌸",lotusX,lotusY);

}

draw();

</script>

</body>
</html>
