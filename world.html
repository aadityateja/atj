<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest World</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

// ======================================
// SETTINGS
// ======================================

const WORLD_SIZE = 300;
const TREE_COUNT = 120;
const MIN_DISTANCE = 10;

// ======================================
// SCENE
// ======================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// optional fog
scene.fog = new THREE.Fog(0xbfd98c, 100, 400);

// ======================================
// CAMERA
// ======================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(60, 40, 60);

// ======================================
// RENDERER
// ======================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

// ======================================
// CONTROLS
// ======================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.target.set(0, 0, 0);

// ======================================
// LIGHTS
// ======================================

const ambient = new THREE.AmbientLight(
    0xffffff,
    1
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.5
);

sun.position.set(100, 200, 100);

scene.add(sun);

// ======================================
// GROUND
// ======================================

const groundGeo = new THREE.PlaneGeometry(
    WORLD_SIZE,
    WORLD_SIZE,
    50,
    50
);

const colors = [];
const color = new THREE.Color();

for (
    let i = 0;
    i < groundGeo.attributes.position.count;
    i++
) {

    color.setRGB(
        0.65 + Math.random() * 0.15,
        0.75 + Math.random() * 0.15,
        0.15
    );

    colors.push(
        color.r,
        color.g,
        color.b
    );
}

groundGeo.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
        colors,
        3
    )
);

const groundMat =
new THREE.MeshStandardMaterial({
    vertexColors: true
});

const ground =
new THREE.Mesh(
    groundGeo,
    groundMat
);

ground.rotation.x = -Math.PI / 2;

scene.add(ground);

// ======================================
// TREE LOADING
// ======================================

const loader = new GLTFLoader();

loader.load(

    "assets/tree.glb",

    (gltf) => {

        console.log("TREE LOADED");

        const baseTree = gltf.scene;

        const positions = [];

        const box =
            new THREE.Box3().setFromObject(
                baseTree
            );

        const yOffset =
            -box.min.y;

        for (
            let i = 0;
            i < TREE_COUNT;
            i++
        ) {

            const tree =
                baseTree.clone();

            let x;
            let z;
            let valid = false;

            while (!valid) {

                x =
                    (Math.random() - 0.5)
                    * WORLD_SIZE;

                z =
                    (Math.random() - 0.5)
                    * WORLD_SIZE;

                valid = true;

                for (
                    const pos of positions
                ) {

                    const dx =
                        x - pos.x;

                    const dz =
                        z - pos.z;

                    const dist =
                        Math.sqrt(
                            dx * dx +
                            dz * dz
                        );

                    if (
                        dist <
                        MIN_DISTANCE
                    ) {
                        valid = false;
                        break;
                    }
                }
            }

            positions.push({
                x,
                z
            });

            tree.position.set(
                x,
                yOffset,
                z
            );

            const scale =
                1 +
                Math.random() * 0.5;

            tree.scale.set(
                scale,
                scale,
                scale
            );

            tree.rotation.y =
                Math.random() *
                Math.PI * 2;

            scene.add(tree);
        }

    },

    undefined,

    (error) => {

        console.error(
            "TREE LOAD ERROR:",
            error
        );

    }

);

// ======================================
// RESIZE
// ======================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

// ======================================
// ANIMATE
// ======================================

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
