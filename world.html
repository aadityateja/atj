<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Forest World</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>

  <!-- 🔥 IMPORT MAP (GitHub-safe fix) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// 🌍 Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// 📷 Camera
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(10, 8, 12);

// 🎮 Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 🕹 Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 💡 Light
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(10, 20, 5);
scene.add(sun);

// 🌱 Ground
const groundGeo = new THREE.PlaneGeometry(200, 200, 50, 50);

// assign vertex colors
const colors = [];
const color = new THREE.Color();

for (let i = 0; i < groundGeo.attributes.position.count; i++) {

  const y = groundGeo.attributes.position.getY(i);

  // mix green + yellow based on position randomness
  color.setRGB(
    0.6 + Math.random() * 0.2,  // red (yellow influence)
    0.8 + Math.random() * 0.2,  // green (dominant)
    0.2                        // blue (kept low)
  );

  colors.push(color.r, color.g, color.b);
}

groundGeo.setAttribute(
  "color",
  new THREE.Float32BufferAttribute(colors, 3)
);

const groundMat = new THREE.MeshStandardMaterial({
  vertexColors: true
});

const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 🔁 Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 🚀 Loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

</script>

</body>
</html>
