
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// =================================
// WORLD SETTINGS
// =================================

const WORLD_SIZE = 300;
const TREE_COUNT = 120;
const MIN_TREE_DISTANCE = 10;;

// =================================
// SCENE
// =================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// =================================
// CAMERA
// =================================

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(20, 20, 20);

// =================================
// RENDERER
// =================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);

// =================================
// CONTROLS
// =================================

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

// =================================
// LIGHTING
// =================================

const ambient = new THREE.AmbientLight(
  0xffffff,
  0.8
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  1.2
);

sun.position.set(
  50,
  100,
  50
);

scene.add(sun);

// =================================
// GROUND
// =================================

const groundGeo = new THREE.PlaneGeometry(
  WORLD_SIZE,
  WORLD_SIZE,
  50,
  50
);

const colors = [];
const color = new THREE.Color();

for (
  let i = 0;
  i < groundGeo.attributes.position.count;
  i++
) {

  color.setRGB(
    0.65 + Math.random() * 0.15,
    0.75 + Math.random() * 0.2,
    0.15
  );

  colors.push(
    color.r,
    color.g,
    color.b
  );
}

groundGeo.setAttribute(
  "color",
  new THREE.Float32BufferAttribute(
    colors,
    3
  )
);

const groundMat =
new THREE.MeshStandardMaterial({
  vertexColors: true
});

const ground =
new THREE.Mesh(
  groundGeo,
  groundMat
);

ground.rotation.x = -Math.PI / 2;

scene.add(ground);

// =================================
// TREE LOADER
// =================================

const loader = new GLTFLoader();

loader.load(
  "./assets/tree.glb",

  (gltf) => {

    const baseTree = gltf.scene;

    const box =
      new THREE.Box3().setFromObject(
        baseTree
      );

    const heightOffset =
      -box.min.y;

    const placedTrees = [];

    for (
      let i = 0;
      i < TREE_COUNT;
      i++
    ) {

      const tree =
        baseTree.clone();

      let x;
      let z;

      let valid = false;

      while (!valid) {

        x =
          (Math.random() - 0.5) *
          WORLD_SIZE;

        z =
          (Math.random() - 0.5) *
          WORLD_SIZE;

        valid = true;

        for (
          const pos of placedTrees
        ) {

          const dx =
            x - pos.x;

          const dz =
            z - pos.z;

          const distance =
            Math.sqrt(
              dx * dx +
              dz * dz
            );

          if (
            distance <
            MIN_TREE_DISTANCE
          ) {

            valid = false;
            break;
          }
        }
      }

      placedTrees.push({
        x,
        z
      });

      tree.position.set(
        x,
        heightOffset,
        z
      );

      const scale =
        0.8 +
        Math.random() * 0.6;

      tree.scale.set(
        scale,
        scale,
        scale
      );

      tree.rotation.y =
        Math.random() *
        Math.PI * 2;

      scene.add(tree);
    }

  },

  undefined,

  (error) => {
    console.error(error);
  }
);

// =================================
// RESIZE
// =================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

// =================================
// ANIMATION
// =================================

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();

</script>
