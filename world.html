<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

// ======================================
// SETTINGS
// ======================================

const WORLD_SIZE = 300;
const TREE_COUNT = 120;
const MIN_DISTANCE = 10;

// ======================================
// SCENE
// ======================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// 🌫️ STRONG FOG (DEBUG + ATMOSPHERE)
scene.fog = new THREE.FogExp2(0xbfd98c, 0.0025);

// ======================================
// CAMERA
// ======================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(60, 40, 60);

// ======================================
// RENDERER
// ======================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

// ======================================
// CONTROLS
// ======================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

// ======================================
// LIGHTS
// ======================================

scene.add(new THREE.AmbientLight(0xffffff, 1));

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(100, 200, 100);
scene.add(sun);

// ======================================
// GROUND
// ======================================

const groundGeo = new THREE.PlaneGeometry(
    WORLD_SIZE,
    WORLD_SIZE,
    50,
    50
);

const colors = [];
const color = new THREE.Color();

for (let i = 0; i < groundGeo.attributes.position.count; i++) {

    color.setRGB(
        0.65 + Math.random() * 0.15,
        0.75 + Math.random() * 0.15,
        0.15
    );

    colors.push(color.r, color.g, color.b);
}

groundGeo.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(colors, 3)
);

const ground = new THREE.Mesh(
    groundGeo,
    new THREE.MeshStandardMaterial({ vertexColors: true })
);

ground.rotation.x = -Math.PI / 2;

scene.add(ground);

// ======================================
// DEBUG CUBE (IMPORTANT TEST)
// ======================================

const debugCube = new THREE.Mesh(
    new THREE.BoxGeometry(5, 5, 5),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
);

debugCube.position.set(0, 5, 0);
scene.add(debugCube);

// ======================================
// TREE LOADING
// ======================================

const loader = new GLTFLoader();

loader.load(
    "assets/tree.glb",

    (gltf) => {

        console.log("TREE LOADED");

        const baseTree = gltf.scene;

        const positions = [];

        const box = new THREE.Box3().setFromObject(baseTree);
        const yOffset = -box.min.y;

        for (let i = 0; i < TREE_COUNT; i++) {

            const tree = baseTree.clone();

            let x, z, valid = false;

            while (!valid) {

                x = (Math.random() - 0.5) * WORLD_SIZE;
                z = (Math.random() - 0.5) * WORLD_SIZE;

                valid = true;

                for (const pos of positions) {

                    const dx = x - pos.x;
                    const dz = z - pos.z;

                    const dist = Math.sqrt(dx * dx + dz * dz);

                    if (dist < MIN_DISTANCE) {
                        valid = false;
                        break;
                    }
                }
            }

            positions.push({ x, z });

            tree.position.set(x, yOffset, z);

            const scale = 1 + Math.random() * 0.5;
            tree.scale.set(scale, scale, scale);

            scene.add(tree);
        }

    },

    undefined,
    (error) => console.error("TREE ERROR:", error)
);

// ======================================
// FOG ANIMATION (SUBTLE BREATHING EFFECT)
// ======================================

let t = 0;

// ======================================
// RESIZE
// ======================================

window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

});

// ======================================
// LOOP
// ======================================

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    // 🌫️ animate fog slightly (breathing effect)
    t += 0.002;
    scene.fog.density = 0.0025 + Math.sin(t) * 0.0003;

    debugCube.rotation.y += 0.01;
    debugCube.rotation.x += 0.005;

    renderer.render(scene, camera);
}

animate();

</script>
