<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

console.log("DRAVYA WORLD STARTED");

// ======================
// SCENE
// ======================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0xbfd98c, 50, 200);

// ======================
// CAMERA (PLAYER)
// ======================

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 10);

// ======================
// RENDERER
// ======================

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ======================
// LIGHTS
// ======================

scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(50, 100, 50);
scene.add(sun);

// ======================
// PROCEDURAL TERRAIN (HILLS)
// ======================

const SIZE = 200;
const SEG = 100;

const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
terrainGeo.rotateX(-Math.PI / 2);

const positions = terrainGeo.attributes.position;

for (let i = 0; i < positions.count; i++) {

    const x = positions.getX(i);
    const z = positions.getZ(i);

    // simple smooth hill function (no libraries needed)
    const y =
        Math.sin(x * 0.05) * 2 +
        Math.cos(z * 0.05) * 2 +
        Math.random() * 0.5;

    positions.setY(i, y);
}

terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({
    color: 0x4caf50,
    flatShading: false
});

const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

// ======================
// TREE LOADER
// ======================

const loader = new GLTFLoader();

const trees = [];
const TREE_COUNT = 80;

loader.load("./assets/tree.glb", (gltf) => {

    const baseTree = gltf.scene;

    for (let i = 0; i < TREE_COUNT; i++) {

        const tree = baseTree.clone();

        const x = (Math.random() - 0.5) * SIZE;
        const z = (Math.random() - 0.5) * SIZE;

        // get terrain height at position
        const y = getHeight(x, z);

        tree.position.set(x, y, z);

        const s = 1 + Math.random() * 0.6;
        tree.scale.set(s, s, s);

        scene.add(tree);
        trees.push(tree);
    }

});

// ======================
// HEIGHT FUNCTION (IMPORTANT)
// ======================

function getHeight(x, z) {

    return (
        Math.sin(x * 0.05) * 2 +
        Math.cos(z * 0.05) * 2
    );
}

// ======================
// PLAYER MOVEMENT
// ======================

const keys = {};
let yaw = 0;
let pitch = 0;

document.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

// mouse lock
document.body.addEventListener("click", () => {
    document.body.requestPointerLock();
});

document.addEventListener("mousemove", (e) => {

    if (document.pointerLockElement !== document.body) return;

    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;

    pitch = Math.max(-1.2, Math.min(1.2, pitch));
});

// ======================
// COLLISION SYSTEM
// ======================

function checkTreeCollision(newPos) {

    for (const t of trees) {

        const dx = newPos.x - t.position.x;
        const dz = newPos.z - t.position.z;

        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < 2.5) return true;
    }

    return false;
}

// ======================
// LOOP
// ======================

const clock = new THREE.Clock();

const velocity = new THREE.Vector3();

function animate() {

    requestAnimationFrame(animate);

    const dt = clock.getDelta();

    // camera rotation
    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();

    const right = new THREE.Vector3();
    right.crossVectors(forward, new THREE.Vector3(0, 1, 0));

    const speed = 8;

    let move = new THREE.Vector3();

    if (keys["w"]) move.add(forward);
    if (keys["s"]) move.sub(forward);
    if (keys["a"]) move.sub(right);
    if (keys["d"]) move.add(right);

    if (move.length() > 0) move.normalize();

    const newPos = camera.position.clone();

    newPos.addScaledVector(move, speed * dt);

    // collision with trees
    if (!checkTreeCollision(newPos)) {
        camera.position.copy(newPos);
    }

    // ground follow (terrain height)
    camera.position.y = getHeight(camera.position.x, camera.position.z) + 2.5;

    renderer.render(scene, camera);
}

animate();

// ======================
// RESIZE
// ======================

window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

});

</script>
