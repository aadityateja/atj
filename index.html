<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya S</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}


@font-face {
    font-family: "Honey";
    src: url("./fonts/HoneyRoom.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
}
    
body{
    overflow:hidden;
    background:#02040a;
    color:white;
    cursor:none;
}

/* ================= QUANTUM FIELD ================= */

canvas{
    position:fixed;
    inset:0;
    z-index:-2;
}

/* soft cosmic haze */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
    radial-gradient(circle at 50% 50%, rgba(0,120,255,0.08), transparent 60%),
    radial-gradient(circle at 20% 80%, rgba(180,0,255,0.06), transparent 50%);
}

/* ================= CURSOR ================= */

#cursor{
    position:fixed;
    width:14px;
    height:14px;
    background:#4fc3ff;
    transform:rotate(45deg);
    box-shadow:0 0 20px #4fc3ff;
    pointer-events:none;
    z-index:9999;
    transition:background .15s;
}

/* ================= CONTENT (NO BOX) ================= */

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

/* FLOATING IDENTITY */

h1{
    letter-spacing:10px;
    font-size:3rem;
    text-shadow:0 0 20px rgba(120,200,255,0.4);
}

p{
    opacity:0.8;
    margin-top:10px;
}

/* PROFILE IMAGE (floating in space) */

img{
    width:240px;
    height:340px;
    object-fit:cover;
    border-radius:18px;
    margin-bottom:20px;

    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-12px);}
}

/* LINKS */

a{
    display:block;
    margin-top:10px;
    color:#cfe8ff;
    text-decoration:none;
    transition:0.3s;
}

a:hover{
    color:white;
    transform:translateX(6px);
}

/* CLICK FLASH */

.flash{
    animation:flash .2s ease;
}

@keyframes flash{
    0%{background:#4fc3ff;}
    50%{background:red;}
    100%{background:#4fc3ff;}
}

</style>
</head>

<body>

<canvas id="field"></canvas>
<div id="cursor"></div>

<div class="center">

<img src="assets/Gemini_Generated_Image_ttqomittqomittqo.png">

<h1>ADITYA</h1>
<p>Researcher • Storyteller</p>

<a href="#">DRAVYA Universe</a>
<a href="#">Particle Catcher</a>
<a href="#">Sun Countdown</a>

</div>

<script>

/* ================= CURSOR ================= */

const cursor = document.getElementById("cursor");

let mouse = {x:innerWidth/2, y:innerHeight/2};

document.addEventListener("mousemove",(e)=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    cursor.style.left = mouse.x + "px";
    cursor.style.top = mouse.y + "px";
});

/* CLICK EFFECT */

document.addEventListener("click",()=>{
    cursor.classList.add("flash");

    setTimeout(()=>{
        cursor.classList.remove("flash");
    },200);
});

/* ================= QUANTUM FIELD ================= */

const canvas = document.getElementById("field");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener("resize",()=>{
    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

/* FIELD GRID */

const grid = [];
const spacing = 18;

for(let x=0;x<innerWidth;x+=spacing){
for(let y=0;y<innerHeight;y+=spacing){
    grid.push({
        x,y,
        ox:x,
        oy:y
    });
}
}

/* SIMPLE WAVE FUNCTION */

function noise(t,x,y){
    return Math.sin(x*0.01 + t) + Math.cos(y*0.01 + t*0.8);
}

/* ANIMATE FIELD */

let t = 0;

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

t += 0.01;

/* gravity source = cursor */
let gx = mouse.x;
let gy = mouse.y;

for(let p of grid){

let dx = gx - p.x;
let dy = gy - p.y;
let dist = Math.sqrt(dx*dx + dy*dy);

/* gravitational distortion */
let force = 120 / (dist+80);

let offsetX = dx * force * 0.08;
let offsetY = dy * force * 0.08;

/* quantum fluctuation */
let w = noise(t,p.ox,p.oy) * 6;

let x = p.ox + offsetX + w;
let y = p.oy + offsetY + w;

/* draw field node */
ctx.fillStyle = "rgba(120,200,255,0.35)";
ctx.fillRect(x,y,1.5,1.5);

}

requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
