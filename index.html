<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dravya World — Playable Portfolio</title>

<style>
html,body{
  margin:0;
  overflow:hidden;
  background:#0a0e1a;
  font-family:monospace;
}
canvas{display:block}

/* 💬 Story UI */
#story{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#0a0e1acc;
  border:1px solid #4fc3ff;
  color:#cfe8ff;
  padding:12px 16px;
  max-width:520px;
  display:none;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div id="story"></div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {

/* ─────────────────────────────
   SETUP
───────────────────────────── */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0e1a, 20, 80);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById("c"), antialias:true});
renderer.setSize(innerWidth, innerHeight);

/* ─────────────────────────────
   LIGHTING
───────────────────────────── */
scene.add(new THREE.AmbientLight(0x334466,1.2));

const sun = new THREE.DirectionalLight(0x88aaff,0.9);
sun.position.set(20,30,10);
scene.add(sun);

/* ─────────────────────────────
   PLAYER (BLUE JEWEL)
───────────────────────────── */
const playerPos = new THREE.Vector3(0,1,0);

const player = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.7),
  new THREE.MeshStandardMaterial({
    color:0x4fc3ff,
    emissive:0x1aa3ff,
    emissiveIntensity:0.9,
    metalness:0.6,
    roughness:0.3
  })
);
scene.add(player);

/* ─────────────────────────────
   INPUT
───────────────────────────── */
const keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

/* ─────────────────────────────
   WORLD
───────────────────────────── */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({color:0x2a5a2a})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* 🏰 Castle */
const castle = new THREE.Mesh(
  new THREE.BoxGeometry(8,6,8),
  new THREE.MeshStandardMaterial({color:0x555577})
);
castle.position.set(15,3,0);
scene.add(castle);

/* 🌲 Forest */
for(let i=0;i<30;i++){
  const tree = new THREE.Mesh(
    new THREE.ConeGeometry(0.8,2.5,6),
    new THREE.MeshStandardMaterial({color:0x1f7a3a})
  );
  tree.position.set(-20+Math.random()*15,1.2,-10+Math.random()*25);
  scene.add(tree);
}

/* 🌊 Lake */
const lake = new THREE.Mesh(
  new THREE.CircleGeometry(6,32),
  new THREE.MeshStandardMaterial({
    color:0x1b4f72,
    transparent:true,
    opacity:0.85
  })
);
lake.rotation.x = -Math.PI/2;
lake.position.set(-15,0.01,15);
scene.add(lake);

/* ⛩ Shrine */
const shrine = new THREE.Mesh(
  new THREE.CylinderGeometry(2,2,4,8),
  new THREE.MeshStandardMaterial({color:0x8888aa})
);
shrine.position.set(0,2,-18);
scene.add(shrine);

/* 🗿 Altar */
const altar = new THREE.Mesh(
  new THREE.BoxGeometry(4,1,3),
  new THREE.MeshStandardMaterial({color:0x444455})
);
altar.position.set(10,0.5,15);
scene.add(altar);

/* ─────────────────────────────
   ZONES (STORY SYSTEM)
───────────────────────────── */
const zones = [
  {
    name:"Castle",
    pos:[15,0],
    r:8,
    story:[
      "🏰 Castle — About Me",
      "I am Aditya S.",
      "I build physics + storytelling worlds."
    ]
  },
  {
    name:"Forest",
    pos:[-15,-5],
    r:10,
    story:[
      "🌲 Forest — Projects",
      "This is where experiments grow.",
      "Each tree is an idea in development."
    ]
  },
  {
    name:"Lake",
    pos:[-15,15],
    r:9,
    story:[
      "🌊 Lake — Reflection",
      "Calm space for thinking.",
      "Where chaos becomes clarity."
    ]
  }
];

const storyBox = document.getElementById("story");
let currentZone = null;
let storyIndex = 0;

/* ─────────────────────────────
   STORY CHECK
───────────────────────────── */
function checkZones(){
  let found = null;

  for(const z of zones){
    const dx = playerPos.x - z.pos[0];
    const dz = playerPos.z - z.pos[1];
    const d = Math.sqrt(dx*dx + dz*dz);

    if(d < z.r){
      found = z;
      break;
    }
  }

  if(found && currentZone !== found){
    currentZone = found;
    storyIndex = 0;
    storyBox.style.display = "block";
    storyBox.innerText = found.story[0];
  }

  if(!found){
    currentZone = null;
    storyBox.style.display = "none";
  }
}

/* ─────────────────────────────
   MOVEMENT
───────────────────────────── */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(),0.05);

  const speed = 10;

  if(keys["KeyW"]) playerPos.z -= speed*dt;
  if(keys["KeyS"]) playerPos.z += speed*dt;
  if(keys["KeyA"]) playerPos.x -= speed*dt;
  if(keys["KeyD"]) playerPos.x += speed*dt;

  /* clamp */
  playerPos.x = Math.max(-50,Math.min(50,playerPos.x));
  playerPos.z = Math.max(-50,Math.min(50,playerPos.z));

  /* player */
  player.position.set(playerPos.x,1.2,playerPos.z);
  player.rotation.y += 0.02;

  /* 🎥 TOP-DOWN CAMERA */
  camera.position.set(playerPos.x+15,25,playerPos.z+15);
  camera.lookAt(playerPos.x,0,playerPos.z);

  checkZones();

  renderer.render(scene,camera);
}

animate();

/* ─────────────────────────────
   RESIZE
───────────────────────────── */
addEventListener("resize",()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

})();
</script>

</body>
</html>
