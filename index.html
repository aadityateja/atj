<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya S — Dravya World</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;font-family:monospace}
#c{width:100vw;height:100vh;display:block}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
'use strict';

/* ─────────────────────────────
   SETUP
───────────────────────────── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0e1a, 20, 80);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);

/* ─────────────────────────────
   LIGHTING
───────────────────────────── */
scene.add(new THREE.AmbientLight(0x334466, 1.2));

const sun = new THREE.DirectionalLight(0x88aaff, 0.8);
sun.position.set(20,30,10);
scene.add(sun);

/* ─────────────────────────────
   PLAYER (BLUE JEWEL)
───────────────────────────── */
const playerPos = new THREE.Vector3(0,1,0);

const playerMesh = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.7),
  new THREE.MeshStandardMaterial({
    color:0x4fc3ff,
    emissive:0x1aa3ff,
    emissiveIntensity:0.9,
    metalness:0.6,
    roughness:0.3
  })
);
scene.add(playerMesh);

/* ─────────────────────────────
   INPUT
───────────────────────────── */
const keys = {};
window.addEventListener('keydown',e=>keys[e.code]=true);
window.addEventListener('keyup',e=>keys[e.code]=false);

/* ─────────────────────────────
   WORLD BUILDING (RESTORED)
───────────────────────────── */

/* ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshLambertMaterial({color:0x2a5a2a})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* castle */
const castle = new THREE.Mesh(
  new THREE.BoxGeometry(8,6,8),
  new THREE.MeshStandardMaterial({color:0x555577})
);
castle.position.set(15,3,0);
scene.add(castle);

/* forest */
for(let i=0;i<25;i++){
  const tree = new THREE.Mesh(
    new THREE.ConeGeometry(0.8,2.5,6),
    new THREE.MeshStandardMaterial({color:0x1f7a3a})
  );
  tree.position.set(
    -20 + Math.random()*15,
    1.2,
    -10 + Math.random()*20
  );
  scene.add(tree);
}

/* lake */
const lake = new THREE.Mesh(
  new THREE.CircleGeometry(6,32),
  new THREE.MeshStandardMaterial({
    color:0x1b4f72,
    transparent:true,
    opacity:0.85
  })
);
lake.rotation.x = -Math.PI/2;
lake.position.set(-15,0.01,15);
scene.add(lake);

/* shrine */
const shrine = new THREE.Mesh(
  new THREE.CylinderGeometry(2,2,4,8),
  new THREE.MeshStandardMaterial({color:0x8888aa})
);
shrine.position.set(0,2,-18);
scene.add(shrine);

/* altar */
const altar = new THREE.Mesh(
  new THREE.BoxGeometry(4,1,3),
  new THREE.MeshStandardMaterial({color:0x444455})
);
altar.position.set(10,0.5,15);
scene.add(altar);

/* ─────────────────────────────
   MOVEMENT
───────────────────────────── */
const clock = new THREE.Clock();
const worldLimit = 50;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(),0.05);

  const speed = 10;

  if(keys['KeyW']) playerPos.z -= speed*dt;
  if(keys['KeyS']) playerPos.z += speed*dt;
  if(keys['KeyA']) playerPos.x -= speed*dt;
  if(keys['KeyD']) playerPos.x += speed*dt;

  playerPos.x = Math.max(-worldLimit, Math.min(worldLimit, playerPos.x));
  playerPos.z = Math.max(-worldLimit, Math.min(worldLimit, playerPos.z));

  /* player visual */
  playerMesh.position.set(playerPos.x,1.2,playerPos.z);
  playerMesh.rotation.y += 0.02;

  /* 🎥 TOP-DOWN CAMERA */
  camera.position.set(
    playerPos.x + 15,
    25,
    playerPos.z + 15
  );

  camera.lookAt(playerPos.x,0,playerPos.z);

  renderer.render(scene,camera);
}

animate();

/* ─────────────────────────────
   RESIZE
───────────────────────────── */
window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

})();
</script>

</body>
</html>
