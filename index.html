<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DRAVYA WORLD</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:monospace;
}

canvas{
    display:block;
    image-rendering: pixelated;
}

#dialog{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    width:500px;

    background:#111;
    border:4px solid white;

    color:white;

    padding:20px;

    display:none;

    font-size:18px;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="dialog"></div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const dialog = document.getElementById("dialog");

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

const player = {
    x:500,
    y:500,
    size:32,
    speed:4
};

const locations = [

{
    x:300,
    y:300,
    w:120,
    h:120,
    color:"green",
    title:"Forest of Curiosity",
    text:"This is where my journey into physics began."
},

{
    x:900,
    y:200,
    w:150,
    h:150,
    color:"gray",
    title:"Castle of Research",
    text:"Research interests, publications and projects."
},

{
    x:1200,
    y:700,
    w:120,
    h:120,
    color:"cyan",
    title:"DRAVYA Cave",
    text:"Portal into my universe."
}

];

let camera = {
    x:0,
    y:0
};

function update(){

    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    camera.x = player.x - canvas.width/2;
    camera.y = player.y - canvas.height/2;

    let near = null;

    locations.forEach(loc=>{

        let dx = player.x - (loc.x+loc.w/2);
        let dy = player.y - (loc.y+loc.h/2);

        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 120){
            near = loc;
        }

    });

    if(near){

        dialog.style.display="block";
        dialog.innerHTML =
        "<h2>"+near.title+"</h2>" +
        "<p>Press E to enter</p>";

        if(keys["e"]){

            dialog.innerHTML =
            "<h2>"+near.title+"</h2>" +
            "<p>"+near.text+"</p>";
        }

    }
    else{
        dialog.style.display="none";
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();

    ctx.translate(-camera.x,-camera.y);

    ctx.fillStyle="#3a7d44";
    ctx.fillRect(-5000,-5000,10000,10000);

    locations.forEach(loc=>{

        ctx.fillStyle=loc.color;

        ctx.fillRect(
            loc.x,
            loc.y,
            loc.w,
            loc.h
        );

    });

    ctx.fillStyle="orange";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    ctx.restore();
}

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
</body>
</html>
