<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aditya S</title>

<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050816;
    font-family:Arial, sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    cursor:none;
}

/* ================= FIELD BACKGROUND ================= */

canvas{
    position:fixed;
    inset:0;
    z-index:-3;
}

/* ================= NEBULA ================= */

.nebula{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
    radial-gradient(circle at 20% 30%, rgba(0,150,255,.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(120,0,255,.15), transparent 40%);
}

/* ================= CURSOR ================= */

#cursor{
    position:fixed;
    width:14px;
    height:14px;
    background:#4fc3ff;
    transform:rotate(45deg);
    box-shadow:0 0 15px #4fc3ff;
    pointer-events:none;
    z-index:9999;
}

/* ================= MAIN ================= */

.main{
    display:flex;
    gap:40px;
    padding:40px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:24px;
    backdrop-filter:blur(20px);
}

/* ================= PHOTO ================= */

.photo-card{
    position:relative;
}

.profile-photo{
    width:240px;
    height:340px;
    object-fit:cover;
    border-radius:18px;
}

/* ORBIT RECTANGLE */

.photo-card::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    background:#6fd3ff;
    box-shadow:0 0 10px #6fd3ff;
    animation:rectOrbit 6s linear infinite;
}

@keyframes rectOrbit{
    0%{top:0;left:0;}
    25%{top:0;left:100%;}
    50%{top:100%;left:100%;}
    75%{top:100%;left:0;}
    100%{top:0;left:0;}
}

/* ================= TEXT ================= */

h1{
    letter-spacing:8px;
    font-size:2.5rem;
}

/* ================= LINKS ================= */

.links a{
    display:block;
    color:white;
    text-decoration:none;
    margin-top:10px;
}

/* ================= PARTICLES ================= */

.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    pointer-events:none;
    animation:fade 0.8s forwards;
}

@keyframes fade{
    to{opacity:0; transform:scale(0);}
}

</style>
</head>

<body>

<div class="nebula"></div>

<canvas id="field"></canvas>

<div id="cursor"></div>

<div class="main">

    <div class="photo-card">
        <img class="profile-photo"
        src="assets/Gemini_Generated_Image_ttqomittqomittqo.png">
    </div>

    <div>
        <h1>ADITYA</h1>
        <p>Researcher • Storyteller</p>

        <div class="links">
            <a href="#">DRAVYA Universe</a>
            <a href="#">Particle Catcher</a>
            <a href="#">Sun Countdown</a>
        </div>
    </div>

</div>

<script>

/* ================= CURSOR ================= */

const cursor = document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
    cursor.style.left = e.clientX+"px";
    cursor.style.top = e.clientY+"px";
});

/* CLICK EFFECT (YOUR REQUEST FIXED) */

document.addEventListener("click",()=>{

cursor.style.background="red";
cursor.style.transform="rotate(225deg)";

setTimeout(()=>{
cursor.style.background="#4fc3ff";
cursor.style.transform="rotate(45deg)";
},150);

});

/* ================= FIELD BACKGROUND ================= */

const canvas = document.getElementById("field");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = innerWidth;
canvas.height = innerHeight;
}
resize();
window.addEventListener("resize",resize);

const points=[];

for(let i=0;i<120;i++){
points.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
vx:(Math.random()-0.5)*0.4,
vy:(Math.random()-0.5)*0.4
});
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let p of points){

p.x+=p.vx;
p.y+=p.vy;

if(p.x<0) p.x=innerWidth;
if(p.x>innerWidth) p.x=0;
if(p.y<0) p.y=innerHeight;
if(p.y>innerHeight) p.y=0;

ctx.fillStyle="rgba(120,200,255,0.8)";
ctx.fillRect(p.x,p.y,2,2);

for(let q of points){

let dx=p.x-q.x;
let dy=p.y-q.y;
let d=Math.sqrt(dx*dx+dy*dy);

if(d<120){
ctx.beginPath();
ctx.strokeStyle=`rgba(100,180,255,${1-d/120})`;
ctx.moveTo(p.x,p.y);
ctx.lineTo(q.x,q.y);
ctx.stroke();
}

}

}

requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
