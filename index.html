<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya S — Dravya World</title>
<style>
/* --- KEEP YOUR ORIGINAL STYLE UNCHANGED --- */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;font-family:'Courier New',monospace}
#c{display:block;width:100vw;height:100vh}

/* (ALL YOUR HUD STYLES UNCHANGED — omitted for brevity in chat) */
/* 👉 KEEP EVERYTHING YOU ALREADY HAD HERE EXACTLY */
</style>
</head>
<body>

<!-- KEEP YOUR ENTIRE HUD EXACTLY AS IS -->
<div id="loading">
  <h2>Loading Dravya World</h2>
  <div id="loadbar"><div id="loadfill"></div></div>
  <div id="loadtip">sculpting the terrain...</div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <div id="zone-label">DRAVYA WORLD</div>
  <div id="xhair"></div>
  <div id="enter-prompt">press SPACE to enter</div>

  <div id="dialog">
    <div id="d-zone">zone</div>
    <div id="d-text"></div>
    <div id="d-hint">[ SPACE or click to continue ]</div>
  </div>

  <div id="controls">
    <kbd>W A S D</kbd> move
  </div>

  <div id="lockbanner">
    <h1>ADITYA S</h1>
    <p>Researcher · Storyteller · Builder</p>
    <div class="hint">walk the world to know me</div>
    <button class="btn" id="startbtn">Enter World</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
'use strict';

/* ─────────────────────────────
   RENDERER + SCENE (UNCHANGED)
───────────────────────────── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x080c18, 25, 80);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth/window.innerHeight,
  0.1,
  200
);

/* ─────────────────────────────
   WORLD + PLAYER (CHANGED CORE)
───────────────────────────── */

// 🌍 world bounds
const worldSize = 50;

// 💠 PLAYER (BLUE JEWEL)
const playerPos = new THREE.Vector3(0, 1, 0);

// visible jewel mesh
const playerMesh = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.6),
  new THREE.MeshStandardMaterial({
    color: 0x4fc3ff,
    emissive: 0x1aa3ff,
    emissiveIntensity: 0.8,
    roughness: 0.3,
    metalness: 0.6
  })
);
scene.add(playerMesh);

/* ─────────────────────────────
   KEEP ALL YOUR WORLD OBJECTS
   (UNCHANGED — castle, forest etc.)
   👉 PASTE YOUR ORIGINAL BUILDING CODE HERE
───────────────────────────── */

// (Your entire world creation code stays exactly same here)
// I am not rewriting it to avoid breaking your structure.

/* ─────────────────────────────
   LIGHTING (KEEP SAME)
───────────────────────────── */
scene.add(new THREE.AmbientLight(0x223355, 1.2));

const sun = new THREE.DirectionalLight(0x6688aa, 0.8);
sun.position.set(20, 30, 10);
scene.add(sun);

/* ─────────────────────────────
   INPUT
───────────────────────────── */
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

/* ─────────────────────────────
   UPDATE LOOP
───────────────────────────── */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  /* ─── MOVEMENT ─── */
  const speed = 10;

  if(keys['KeyW']) playerPos.z -= speed * dt;
  if(keys['KeyS']) playerPos.z += speed * dt;
  if(keys['KeyA']) playerPos.x -= speed * dt;
  if(keys['KeyD']) playerPos.x += speed * dt;

  /* clamp world */
  playerPos.x = Math.max(-worldSize, Math.min(worldSize, playerPos.x));
  playerPos.z = Math.max(-worldSize, Math.min(worldSize, playerPos.z));

  /* ─── PLAYER VISUAL ─── */
  playerMesh.position.set(playerPos.x, 1.2, playerPos.z);
  playerMesh.position.y = 1.2 + Math.sin(Date.now()*0.002)*0.15;
  playerMesh.rotation.y += 0.01;

  /* ─── 🎥 TOP-DOWN MAP CAMERA ─── */
  camera.position.set(
    playerPos.x + 12,
    22,
    playerPos.z + 12
  );

  camera.lookAt(playerPos.x, 0, playerPos.z);

  renderer.render(scene, camera);
}

animate();

/* ─────────────────────────────
   RESIZE
───────────────────────────── */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

})();
</script>

</body>
</html>
