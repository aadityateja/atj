<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya S — Dravya World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;font-family:'Courier New',monospace}
#c{display:block;width:100vw;height:100vh}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}

#zone-label{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  color:#7fd4ff;font-size:11px;letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 0 15px #4fc3ff88;transition:opacity .5s;white-space:nowrap;
}

/* Dialog box */
#dialog{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  width:min(540px,88%);background:#06091488;backdrop-filter:blur(12px);
  border:1.5px solid #4fc3ff;border-radius:4px;
  padding:16px 20px 14px;display:none;pointer-events:all;
}
#d-zone{font-size:10px;color:#4fc3ff;letter-spacing:2.5px;margin-bottom:6px;text-transform:uppercase}
#d-text{font-size:12.5px;color:#cfe8ff;line-height:1.8;min-height:44px}
#d-hint{font-size:10px;color:#4fc3ff44;margin-top:10px;text-align:right}

/* Controls hint */
#controls{position:absolute;bottom:24px;left:20px;font-size:10px;color:#4fc3ff55;line-height:2.2}
#controls kbd{
  display:inline-block;background:#4fc3ff11;border:1px solid #4fc3ff33;
  border-radius:3px;padding:1px 5px;font-size:9px;font-family:'Courier New',monospace;
}

/* Compass */
#compass-wrap{position:absolute;top:16px;right:20px}
#compass-wrap svg{display:block}

/* Zone enter prompt */
#enter-prompt{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#4fc3ff;font-size:11px;letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 0 10px #4fc3ff;opacity:0;transition:opacity .3s;
  pointer-events:none;text-align:center;
}

/* Crosshair */
#xhair{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;pointer-events:none;opacity:.35;
}
#xhair::before,#xhair::after{content:'';position:absolute;background:#4fc3ff}
#xhair::before{width:1px;height:14px;left:50%;transform:translateX(-50%)}
#xhair::after{width:14px;height:1px;top:50%;transform:translateY(-50%)}

/* Click-to-lock banner */
#lockbanner{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;pointer-events:all;cursor:pointer;
  background:#0a0e1a99;backdrop-filter:blur(2px);
}
#lockbanner h1{font-size:clamp(18px,4vw,36px);letter-spacing:8px;color:#fff;text-shadow:0 0 30px #4fc3ff66}
#lockbanner p{font-size:12px;color:#4fc3ff99;letter-spacing:2px}
#lockbanner .hint{font-size:11px;color:#4fc3ff55;margin-top:8px;letter-spacing:1px}
#lockbanner .btn{
  margin-top:8px;padding:10px 28px;border:1.5px solid #4fc3ff;
  color:#4fc3ff;letter-spacing:3px;font-size:11px;font-family:'Courier New',monospace;
  background:transparent;cursor:pointer;transition:.2s;text-transform:uppercase;
}
#lockbanner .btn:hover{background:#4fc3ff15}

/* Loading */
#loading{
  position:fixed;inset:0;background:#0a0e1a;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
#loading h2{color:#4fc3ff;font-size:13px;letter-spacing:4px;text-transform:uppercase}
#loadbar{width:220px;height:2px;background:#4fc3ff15;border-radius:2px;overflow:hidden}
#loadfill{height:100%;background:#4fc3ff;width:0%;transition:width .25s}
#loadtip{font-size:10px;color:#4fc3ff44;letter-spacing:1.5px;margin-top:4px}

/* Mobile dpad */
#dpad{
  position:absolute;bottom:80px;right:20px;
  display:none;pointer-events:all;
}
#dpad button{
  position:absolute;width:42px;height:42px;background:#4fc3ff15;
  border:1px solid #4fc3ff44;border-radius:4px;color:#4fc3ff;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
#dpad button:active{background:#4fc3ff33}
#btn-u{left:42px;top:0}
#btn-d{left:42px;top:84px}
#btn-l{left:0;top:42px}
#btn-r{left:84px;top:42px}

@media(max-width:700px){
  #dpad{display:block}
  #controls{display:none}
}
</style>
</head>
<body>

<div id="loading">
  <h2>Loading Dravya World</h2>
  <div id="loadbar"><div id="loadfill"></div></div>
  <div id="loadtip">sculpting the terrain...</div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <div id="zone-label">DRAVYA WORLD</div>
  <div id="xhair"></div>

  <div id="enter-prompt">press SPACE to enter</div>

  <div id="dialog">
    <div id="d-zone">zone</div>
    <div id="d-text"></div>
    <div id="d-hint">[ SPACE or click to continue ]</div>
  </div>

  <div id="controls">
    <kbd>W A S D</kbd> move &nbsp;<kbd>Mouse</kbd> look<br>
    <kbd>SPACE</kbd> interact &nbsp;<kbd>ESC</kbd> unlock mouse
  </div>

  <div id="compass-wrap">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="26" fill="none" stroke="#4fc3ff22" stroke-width="1"/>
      <text x="28" y="9" fill="#4fc3ff66" font-size="7" text-anchor="middle" font-family="monospace">N</text>
      <text x="28" y="51" fill="#4fc3ff33" font-size="7" text-anchor="middle" font-family="monospace">S</text>
      <text x="7" y="31" fill="#4fc3ff33" font-size="7" text-anchor="middle" font-family="monospace">W</text>
      <text x="50" y="31" fill="#4fc3ff33" font-size="7" text-anchor="middle" font-family="monospace">E</text>
      <polygon id="needle" points="28,12 30,28 28,26 26,28" fill="#4fc3ff" opacity="0.9"/>
    </svg>
  </div>

  <div id="lockbanner">
    <h1>ADITYA S</h1>
    <p>Researcher &nbsp;·&nbsp; Storyteller &nbsp;·&nbsp; Builder</p>
    <div class="hint">walk the world to know me</div>
    <button class="btn" id="startbtn">Enter World</button>
  </div>

  <div id="dpad">
    <button id="btn-u">↑</button>
    <button id="btn-d">↓</button>
    <button id="btn-l">←</button>
    <button id="btn-r">→</button>
  </div>
</div>

<!-- Three.js r128 from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';

/* ─── Loading UI ─── */
const loadfill = document.getElementById('loadfill');
const loadtip  = document.getElementById('loadtip');
const tips = ['sculpting terrain...','planting ancient trees...','filling the lake...','lighting torches...','summoning the castle...','ready.'];
let tipIdx = 0;
function setLoad(p){ loadfill.style.width = p+'%'; loadtip.textContent = tips[Math.min(tipIdx++, tips.length-1)]; }
setLoad(5);

/* ─── Renderer ─── */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x080c18);
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

/* ─── Scene / Camera ─── */
const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x080c18, 0.018);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 2, 0);

const clock = new THREE.Clock();
setLoad(15);

/* ─── Materials helpers ─── */
const M = (col, rough=0.85) => new THREE.MeshLambertMaterial({ color: col });

/* ─── Ground ─── */
const groundGeo = new THREE.PlaneGeometry(100, 100, 60, 60);
// Slight terrain undulation
const pos = groundGeo.attributes.position;
for(let i=0; i<pos.count; i++){
  const x = pos.getX(i), z = pos.getZ(i);
  if(Math.abs(x)<2 && Math.abs(z)<2) continue; // flat spawn
  pos.setY(i, (Math.sin(x*.18)*Math.cos(z*.18)*.6 + Math.sin(x*.4+1)*Math.sin(z*.3+2)*.3));
}
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, M(0x2a5518));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* path stones */
function pathRing(cx,cz,r,count){
  for(let i=0;i<count;i++){
    const a=i/count*Math.PI*2, px=cx+Math.cos(a)*r, pz=cz+Math.sin(a)*r;
    const sg=new THREE.BoxGeometry(.6+Math.random()*.4,.08,.6+Math.random()*.4);
    const sm=new THREE.Mesh(sg,M(0x8b7355));
    sm.position.set(px,.04,pz);sm.rotation.y=Math.random()*Math.PI;
    sm.receiveShadow=true;scene.add(sm);
  }
}
pathRing(0,0,6,20); pathRing(0,0,10,32);

setLoad(25);

/* ─── Tree factory ─── */
function makeTree(x,z,s=1){
  const group = new THREE.Group();
  // trunk
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.26*s,1.6*s,7), M(0x5a3a1a));
  trunk.position.y = .8*s; trunk.castShadow=true; group.add(trunk);
  // 3 layered cones
  const layerCols = [0x1a4d10, 0x2d6b1a, 0x3a8a24];
  const layerData = [[1.0*s, 2.2*s, 1.8], [.8*s, 1.8*s, 2.9], [.55*s, 1.4*s, 3.9]];
  layerData.forEach(([r,h,y],i)=>{
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r,h,8), M(layerCols[i]));
    cone.position.y = y*s; cone.castShadow=true; group.add(cone);
  });
  group.position.set(x,0,z);
  // small random tilt
  group.rotation.z = (Math.random()-.5)*.06;
  group.rotation.x = (Math.random()-.5)*.04;
  scene.add(group);
  return group;
}

// Forest clusters
const forestA = [[-14,-8],[-16,-6],[-12,-10],[-18,-5],[-13,-12],[-15,-4],[-11,-8],[-17,-9],[-14,-14],[-10,-14],[-12,-16],[-16,-13],[-18,-11],[-9,-11],[-13,-7],[-15,-11]];
const forestB = [[-6,16],[-8,14],[-4,18],[-7,12],[-5,14],[-9,16],[4,18],[6,16],[2,20],[5,20],[3,16],[7,18]];
const scatterTrees = [[12,-4],[14,-6],[10,-3],[16,-2],[8,-6],[-4,-18],[-6,-16],[-8,-20],[-2,-16],[22,6],[24,4],[22,10],[-20,4],[-22,2],[-18,6]];

[...forestA,...forestB,...scatterTrees].forEach(([x,z])=>{
  makeTree(x + (Math.random()-.5)*.8, z + (Math.random()-.5)*.8, .7+Math.random()*.7);
});
setLoad(38);

/* ─── Torch factory ─── */
const torchLights = [];
function makeTorch(x,z){
  const g = new THREE.Group();
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.9,6), M(0x8b6914));
  stick.position.y = .45; g.add(stick);
  const flame = new THREE.Mesh(new THREE.SphereGeometry(.13,7,7), new THREE.MeshBasicMaterial({color:0xff8800}));
  flame.position.y = .98; g.add(flame);
  const innerFlame = new THREE.Mesh(new THREE.SphereGeometry(.07,6,6), new THREE.MeshBasicMaterial({color:0xffdd44}));
  innerFlame.position.y = 1.02; g.add(innerFlame);
  g.position.set(x,0,z);
  scene.add(g);
  const light = new THREE.PointLight(0xff6600, 2.2, 8);
  light.position.set(x, 1.1, z);
  scene.add(light);
  torchLights.push({flame, innerFlame, light, offset: Math.random()*Math.PI*2});
}
[[-3,4],[3,4],[0,-5],[8,8],[-8,8],[16,4],[-2,-11],[14,-8],[0,14],[-14,2],[6,-18],[-4,18],[18,-4]].forEach(([x,z])=>makeTorch(x,z));
setLoad(50);

/* ─── Castle ─── */
function makeCastle(cx,cz){
  const g = new THREE.Group();
  // Base platform
const platform = new THREE.Mesh(
  new THREE.BoxGeometry(10,0.6,10),
  M(0x3a3050)
);

platform.position.set(0,0.3,0);

g.add(platform);
  
  // Main keep
  const keep = new THREE.Mesh(new THREE.BoxGeometry(7,6,7),M(0x4a3a6a));
  keep.position.y=3.3; keep.castShadow=true; g.add(keep);
  // Keep roof
  const keepRoof = new THREE.Mesh(new THREE.ConeGeometry(5,2.5,4),M(0x2a2040));
  keepRoof.position.y=8.05; keepRoof.rotation.y=Math.PI/4; g.add(keepRoof);
  // Towers at corners
  [[-3.5,-3.5],[-3.5,3.5],[3.5,-3.5],[3.5,3.5]].forEach(([tx,tz])=>{
    const tw = new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.3,7,10),M(0x5a4a7a));
    tw.position.set(tx,3.5,tz); tw.castShadow=true; g.add(tw);
    const tr = new THREE.Mesh(new THREE.ConeGeometry(1.4,2,10),M(0xcc2222));
    tr.position.set(tx,8,tz); g.add(tr);
    // Battlements
    for(let b=0;b<6;b++){
      const ba=b/6*Math.PI*2;
      const bm=new THREE.Mesh(new THREE.BoxGeometry(.2,.3,.2),M(0x4a3a6a));
      bm.position.set(tx+Math.cos(ba)*.9,7.3,tz+Math.sin(ba)*.9); g.add(bm);
    }
  });
  // Gate arch
  const gate = new THREE.Mesh(new THREE.BoxGeometry(2,3,.5),M(0x2a1a3a));
  gate.position.set(0,1.8,-3.5); g.add(gate);
  // Windows (glowing)
  [[0,3.5,-3.6],[-2,4.5,0],[2,4.5,0],[0,4.5,3.6]].forEach(([wx,wy,wz])=>{
    const wm = new THREE.Mesh(new THREE.PlaneGeometry(.9,.9), new THREE.MeshBasicMaterial({color:0xffdd44}));
    wm.position.set(wx,wy,wz);
    if(Math.abs(wz)<0.1) wm.rotation.y=Math.PI/2;
    g.add(wm);
  });
  // Castle light
  const cl = new THREE.PointLight(0xffcc44,3,18);
  cl.position.set(0,9,0); g.add(cl);
  const bl = new THREE.PointLight(0x4466ff,1.5,10);
  bl.position.set(0,2,0); g.add(bl);
  // Flag
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(.8,.5),new THREE.MeshBasicMaterial({color:0xff2222,side:THREE.DoubleSide}));
  flag.position.set(.5,10,0); g.add(flag);

  g.position.set(cx,0,cz);
  scene.add(g);
}
makeCastle(20,0);
setLoad(60);

/* ─── Shrine ─── */
function makeShrine(cx,cz){
  const g = new THREE.Group();
  // Stone base steps
  [[4,.3,4,0],[3,.4,3,.3],[2,.4,2,.7]].forEach(([w,h,d,y])=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(0x4a4a6a));
    m.position.y=y; m.receiveShadow=true; g.add(m);
  });
  // Pillars
  [[-1,0],[1,0],[0,-1],[0,1]].forEach(([px,pz])=>{
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,2.5,8),M(0x5a5a7a));
    p.position.set(px,2.15,pz); p.castShadow=true; g.add(p);
  });
  // Roof
  const roof=new THREE.Mesh(new THREE.BoxGeometry(3.2,.3,3.2),M(0x3a3a5a));
  roof.position.y=3.55; g.add(roof);
  const roofTop=new THREE.Mesh(new THREE.ConeGeometry(2.2,1.4,4),M(0x2a2a4a));
  roofTop.position.y=4.55; roofTop.rotation.y=Math.PI/4; g.add(roofTop);
  // Crystal
  const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.4),new THREE.MeshBasicMaterial({color:0x4fc3ff}));
  crystal.position.y=2; g.add(crystal);
  const sl=new THREE.PointLight(0x4fc3ff,3,10);sl.position.y=2.5; g.add(sl);
  g.position.set(cx,0,cz);
  scene.add(g);
  return {crystal};
}
const shrine = makeShrine(6,-16);
setLoad(68);

/* ─── Altar ─── */
function makeAltar(cx,cz){
  const g = new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(4.5,.6,3.5),M(0x4a4a5a));
  base.position.y=.3; base.receiveShadow=true; g.add(base);
  const top=new THREE.Mesh(new THREE.BoxGeometry(3,.8,2.2),M(0x3a3050));
  top.position.y=.9; g.add(top);
  // Runes carved in
  const rune=new THREE.Mesh(new THREE.PlaneGeometry(2,.6),new THREE.MeshBasicMaterial({color:0x7040ff,side:THREE.DoubleSide}));
  rune.position.set(0,1.31,0); rune.rotation.x=-Math.PI/2; g.add(rune);
  // Candles
  [[-1.2,0],[-0.4,0],[0.4,0],[1.2,0]].forEach(([px,pz])=>{
    const c=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.5,6),M(0xddccaa));
    c.position.set(px,1.55,pz); g.add(c);
    const f=new THREE.Mesh(new THREE.SphereGeometry(.06,5,5),new THREE.MeshBasicMaterial({color:0xff8800}));
    f.position.set(px,1.83,pz); g.add(f);
    const l=new THREE.PointLight(0xff5500,1,3.5);l.position.set(px,2,pz);g.add(l);
  });
  g.position.set(cx,0,cz);
  scene.add(g);
}
makeAltar(10,12);

/* ─── Lake ─── */
function makeLake(cx,cz){
  const geo = new THREE.CircleGeometry(7.5,48);
  const mat = new THREE.MeshLambertMaterial({color:0x1a3d5c,transparent:true,opacity:.88});
  const lake = new THREE.Mesh(geo,mat);
  lake.rotation.x=-Math.PI/2; lake.position.set(cx,.06,cz);
  scene.add(lake);
  // sandy rim
  const rim=new THREE.Mesh(new THREE.RingGeometry(7.5,8.4,48),new THREE.MeshLambertMaterial({color:0xc8a96e,side:THREE.DoubleSide}));
  rim.rotation.x=-Math.PI/2; rim.position.set(cx,.04,cz); scene.add(rim);
  // dock
  const dock=new THREE.Mesh(new THREE.BoxGeometry(1.2,.1,3.5),M(0x8b6914));
  dock.position.set(cx-6,.1,cz+2); scene.add(dock);
  for(let i=0;i<3;i++){
    const post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.5,5),M(0x6a4a14));
    post.position.set(cx-5.4,.05,cz+i*1.2); scene.add(post);
  }
  const light=new THREE.PointLight(0x2288cc,2,14);
  light.position.set(cx,1,cz); scene.add(light);
  return {lake, mat};
}
const lakeObj = makeLake(-12,10);

/* ─── Waterfall ─── */
function makeWaterfall(cx,cz){
  const cliff=new THREE.Mesh(new THREE.BoxGeometry(5,8,3),M(0x3a3a4a));
  cliff.position.set(cx,4,cz); cliff.castShadow=true; scene.add(cliff);
  const wfall=new THREE.Mesh(new THREE.PlaneGeometry(2.5,6),new THREE.MeshBasicMaterial({color:0x4488cc,transparent:true,opacity:.5,side:THREE.DoubleSide}));
  wfall.position.set(cx,4,cz+1.6); scene.add(wfall);
  const pool=new THREE.Mesh(new THREE.CircleGeometry(2.5,24),new THREE.MeshLambertMaterial({color:0x1a3d5c,transparent:true,opacity:.8}));
  pool.rotation.x=-Math.PI/2; pool.position.set(cx,.07,cz+4); scene.add(pool);
}
makeWaterfall(-8,-18);

setLoad(76);

/* ─── Lighting ─── */
const sun = new THREE.DirectionalLight(0x6688aa, 0.7);
sun.position.set(15,25,8);
sun.castShadow=true;
sun.shadow.mapSize.width=2048; sun.shadow.mapSize.height=2048;
sun.shadow.camera.near=.5; sun.shadow.camera.far=80;
sun.shadow.camera.left=-40; sun.shadow.camera.right=40;
sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40;
sun.shadow.bias=-.001;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x223355,1.0));
const moonLight=new THREE.PointLight(0x334488,.5,120);
moonLight.position.set(-25,30,-12); scene.add(moonLight);

/* ─── Stars ─── */
const starVerts=[];
for(let i=0;i<1200;i++){
  const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
  const r=80+Math.random()*20;
  starVerts.push(r*Math.sin(phi)*Math.cos(theta), Math.abs(r*Math.cos(phi))+5, r*Math.sin(phi)*Math.sin(theta));
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starVerts,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.22,sizeAttenuation:true})));

/* ─── Moon ─── */
const moon=new THREE.Mesh(new THREE.SphereGeometry(3,16,16),new THREE.MeshBasicMaterial({color:0xddeeff}));
moon.position.set(-40,45,-50); scene.add(moon);

setLoad(85);

/* ─── Zone definitions ─── */
const ZONES=[
  {name:'DRAVYA CASTLE',  icon:'🏰', pos:[20,0],  r:8,
   title:'About Aditya',
   lines:['Hi — I\'m Aditya S. Researcher & storyteller.','I explore the universe through physics,','narrative, and code. Creator of the DRAVYA Universe.','Currently building worlds at the edge of science.']},
  {name:'WHISPERING FOREST', icon:'🌲', pos:[-14,-8], r:7,
   title:'Projects',
   lines:['◆ DRAVYA Universe — sci-fi worldbuilding series','◆ Particle Catcher — quantum field visualizer','◆ Sun Countdown — solar event tracker','◆ This very 3D world you\'re walking through right now']},
  {name:'REFLECTION LAKE', icon:'🌊', pos:[-12,10], r:8,
   title:'Contact & Links',
   lines:['Find me across the digital cosmos:','◆  dravyauniverse.com','◆  @adityasjourney on social','The lake is calm — say hello anytime.']},
  {name:'ANCIENT SHRINE', icon:'⛩',  pos:[6,-16],  r:6,
   title:'Philosophy',
   lines:['"The world waits to be seen —',' not to be understood,  but to be witnessed."','','              — Diary Fragment 1/6']},
  {name:'STONE ALTAR',   icon:'🗿', pos:[10,12],  r:6,
   title:'Skills & Tools',
   lines:['◆ Physics & Scientific Research','◆ Worldbuilding & Creative Writing','◆ Web Dev — JS, Three.js, Canvas, CSS','◆ Data Visualization & Simulation']},
];

/* ─── Player / Camera state ─── */
const playerPos = new THREE.Vector3(0, 1.7, 0);
let yaw=0, pitch=0;
const SPEED=6, SPRINT=10;
const keys={};
let pointerLocked=false;
let dialogOpen=false, dialogLines=[], dialogIdx=0, typed='', typeTimer=0;
let currentZone=null, nearZone=null;
let tick=0;

/* ─── Pointer Lock ─── */
const lockbanner=document.getElementById('lockbanner');
const startbtn=document.getElementById('startbtn');

function requestLock(){
  canvas.requestPointerLock = canvas.requestPointerLock||canvas.mozRequestPointerLock;
  canvas.requestPointerLock();
}
startbtn.addEventListener('click',requestLock);
canvas.addEventListener('click',()=>{ if(!pointerLocked&&!dialogOpen) requestLock(); });

document.addEventListener('pointerlockchange',()=>{
  pointerLocked=!!document.pointerLockElement;
  lockbanner.style.display = pointerLocked?'none':'flex';
});
document.addEventListener('mozpointerlockchange',()=>{
  pointerLocked=!!document.mozPointerLockElement;
  lockbanner.style.display = pointerLocked?'none':'flex';
});

document.addEventListener('mousemove',e=>{
  if(!pointerLocked||dialogOpen) return;
  yaw   -= e.movementX * .0018;
  pitch  = Math.max(-.6, Math.min(.6, pitch - e.movementY*.0018));
});

/* ─── Keyboard ─── */
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){
    e.preventDefault();
    if(nearZone&&!dialogOpen) openDialog(nearZone);
    else if(dialogOpen) advanceDialog();
  }
  if(e.code==='Escape'&&dialogOpen){ closeDialog(); }
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });

/* ─── Mobile D-pad ─── */
const dpadMap={ 'btn-u':'KeyW','btn-d':'KeyS','btn-l':'KeyA','btn-r':'KeyD' };
Object.entries(dpadMap).forEach(([id,code])=>{
  const btn=document.getElementById(id);
  btn.addEventListener('touchstart',e=>{e.preventDefault();keys[code]=true},{passive:false});
  btn.addEventListener('touchend',e=>{e.preventDefault();keys[code]=false},{passive:false});
  btn.addEventListener('mousedown',()=>keys[code]=true);
  btn.addEventListener('mouseup',()=>keys[code]=false);
});

/* ─── Dialog ─── */
const dialogEl = document.getElementById('dialog');
const dzoneEl  = document.getElementById('d-zone');
const dtextEl  = document.getElementById('d-text');
const enterPrompt = document.getElementById('enter-prompt');
const needle   = document.getElementById('needle');
const zoneLabel= document.getElementById('zone-label');

function openDialog(z){
  dialogOpen=true;
  dialogLines=[z.title,...z.lines];
  dialogIdx=0; typed=''; typeTimer=0;
  dzoneEl.textContent = z.icon+' '+z.name;
  dtextEl.innerHTML='';
  dialogEl.style.display='block';
  if(document.exitPointerLock) document.exitPointerLock();
}
function closeDialog(){
  dialogOpen=false;
  dialogEl.style.display='none';
}
function advanceDialog(){
  const line=dialogLines[dialogIdx]||'';
  if(typed.length<line.length){ typed=line; renderDialog(); return; }
  dialogIdx++; typed=''; typeTimer=0;
  if(dialogIdx>=dialogLines.length) closeDialog();
  else renderDialog();
}
function renderDialog(){
  const done=dialogLines.slice(0,dialogIdx).map((l,i)=>
    i===0 ? `<span style="color:#fff;font-weight:bold;font-size:13px;display:block;margin-bottom:4px">${l}</span>`
          : `<span style="color:#cfe8ff;display:block">${l}</span>`
  ).join('');
  const cur = dialogIdx===0
    ? `<span style="color:#fff;font-weight:bold;font-size:13px;display:block;margin-bottom:4px">${typed}</span>`
    : `<span style="color:#cfe8ff;display:block">${typed}</span>`;
  dtextEl.innerHTML = done+cur;
}
dialogEl.addEventListener('click',advanceDialog);

/* ─── Zone detection ─── */
function getNearestZone(){
  let best=null, bestD=Infinity;
  ZONES.forEach(z=>{
    const dx=playerPos.x-z.pos[0], dz=playerPos.z-z.pos[1];
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<z.r && d<bestD){ bestD=d; best=z; }
  });
  return best;
}

/* ─── Resize ─── */
window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

setLoad(95);
setTimeout(()=>{ document.getElementById('loading').style.display='none'; },600);

/* ─── Main loop ─── */
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  tick++;

  /* Movement */
  if(!dialogOpen){
    const speed = keys['ShiftLeft']||keys['ShiftRight'] ? SPRINT : SPEED;
    const fwd   = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right  = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    if(keys['KeyW']||keys['ArrowUp'])   playerPos.addScaledVector(fwd,   speed*dt);
    if(keys['KeyS']||keys['ArrowDown']) playerPos.addScaledVector(fwd,  -speed*dt);
    if(keys['KeyA']||keys['ArrowLeft']) playerPos.addScaledVector(right, -speed*dt);
    if(keys['KeyD']||keys['ArrowRight'])playerPos.addScaledVector(right,  speed*dt);
    playerPos.x = Math.max(-44, Math.min(44, playerPos.x));
    playerPos.z = Math.max(-44, Math.min(44, playerPos.z));
    playerPos.y = 1.7; // keep on ground
  }

  /* Camera follows player with look direction */
  camera.position.copy(playerPos);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  /* Zone detection */
  nearZone = getNearestZone();
  if(nearZone !== currentZone){
    currentZone=nearZone;
    if(nearZone){
      zoneLabel.textContent=nearZone.icon+' '+nearZone.name;
      zoneLabel.style.opacity='1';
      enterPrompt.style.opacity='1';
    } else {
      zoneLabel.textContent='DRAVYA WORLD';
      zoneLabel.style.opacity='0.5';
      enterPrompt.style.opacity='0';
    }
  }

  /* Typewriter */
  if(dialogOpen){
    const line=dialogLines[dialogIdx]||'';
    typeTimer++;
    if(typeTimer%2===0 && typed.length<line.length){
      typed+=line[typed.length];
      renderDialog();
    }
  }

  /* Torch flicker */
  torchLights.forEach(t=>{
    const f=Math.sin(tick*.13+t.offset)*0.5+Math.sin(tick*.27+t.offset*1.3)*0.3;
    t.light.intensity=1.8+f*.8;
    const s=1+f*.07;
    t.flame.scale.set(s,s,s);
    t.flame.position.y=.98+f*.03;
    t.innerFlame.position.y=1.02+f*.04;
  });

  /* Lake shimmer */
  lakeObj.mat.opacity=.82+Math.sin(tick*.03)*.07;

  /* Shrine crystal spin */
  shrine.crystal.rotation.y+=.02;
  shrine.crystal.rotation.x=Math.sin(tick*.04)*.3;
  shrine.crystal.position.y=2+Math.sin(tick*.05)*.08;

  /* Compass needle */
  const nx=28+16*Math.sin(-yaw), ny=28-16*Math.cos(-yaw);
  const lx=28+3*Math.cos(-yaw), ly=28+3*Math.sin(-yaw);
  const rx=28-3*Math.cos(-yaw), ry=28-3*Math.sin(-yaw);
  needle.setAttribute('points',`28,12 ${lx},${ly} ${nx},${ny} ${rx},${ry}`);

  renderer.render(scene,camera);
}

setLoad(100);
animate();

})();
</script>
</body>
</html>
