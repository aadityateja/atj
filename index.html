<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya S</title>

<style>

/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#02040a;
    font-family:Arial;
    color:white;
    cursor:none;
}

/* ================= FIELD ================= */

canvas{
    position:fixed;
    inset:0;
    z-index:-3;
    transform: perspective(900px) rotateX(18deg);
}

/* cosmic haze */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
    radial-gradient(circle at 30% 40%, rgba(0,140,255,0.10), transparent 60%),
    radial-gradient(circle at 70% 60%, rgba(140,0,255,0.08), transparent 55%);
}

/* ================= CURSOR ================= */

#cursor{
    position:fixed;
    width:14px;
    height:14px;
    background:#4fc3ff;
    transform:rotate(45deg);
    box-shadow:0 0 20px #4fc3ff;
    pointer-events:none;
    z-index:9999;
}

/* ================= CENTER CONTENT ================= */

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

/* FLOATING IMAGE */

img{
    width:240px;
    height:340px;
    object-fit:cover;
    border-radius:18px;
    margin-bottom:20px;
    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-12px);}
}

/* TEXT */

h1{
    letter-spacing:10px;
    font-size:3rem;
    text-shadow:0 0 25px rgba(120,200,255,0.4);
}

p{
    opacity:0.8;
}

/* LINKS */

a{
    display:block;
    margin-top:10px;
    color:#cfe8ff;
    text-decoration:none;
    transition:0.3s;
}

a:hover{
    transform:translateX(6px);
    color:white;
}

</style>
</head>

<body>

<canvas id="field"></canvas>
<div id="cursor"></div>

<div class="center">

<img src="assets/Gemini_Generated_Image_ttqomittqomittqo.png">

<h1>ADITYA</h1>
<p>Researcher • Storyteller</p>

<a href="#">🌌 DRAVYA Universe</a>
<a href="#">⚛️ Particle Catcher</a>
<a href="#">☀️ Sun Countdown</a>

</div>

<script>

/* ================= CURSOR ================= */

const cursor = document.getElementById("cursor");

let mouse = {x:innerWidth/2, y:innerHeight/2};

document.addEventListener("mousemove",(e)=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    cursor.style.left = mouse.x + "px";
    cursor.style.top = mouse.y + "px";
});

/* CLICK → RED FLASH + SPIN */

document.addEventListener("click",()=>{

cursor.style.background="red";
cursor.style.transform="rotate(225deg)";

setTimeout(()=>{
cursor.style.background="#4fc3ff";
cursor.style.transform="rotate(45deg)";
},150);

});

/* ================= QUANTUM FIELD ================= */

const canvas = document.getElementById("field");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

window.addEventListener("resize",()=>{
    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

const nodes = [];
const spacing = 16;

/* grid */
for(let x=0;x<innerWidth;x+=spacing){
for(let y=0;y<innerHeight;y+=spacing){
nodes.push({
x,y,
ox:x,oy:y,
vx:0,vy:0
});
}
}

/* ripples */
const ripples = [];

document.addEventListener("click",(e)=>{
ripples.push({
x:e.clientX,
y:e.clientY,
r:0
});
});

/* animation */

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let n of nodes){

/* slow quantum jitter */
n.vx += (Math.random()-0.5)*0.02;
n.vy += (Math.random()-0.5)*0.02;

n.vx *= 0.96;
n.vy *= 0.96;

n.x += n.vx;
n.y += n.vy;

/* restore */
n.x += (n.ox - n.x)*0.02;
n.y += (n.oy - n.y)*0.02;

/* ripple interaction */
for(let r of ripples){

let dx = n.x - r.x;
let dy = n.y - r.y;
let d = Math.sqrt(dx*dx+dy*dy);

if(d < r.r || r.r===0){
let f = 80/(d+60);
n.vx += dx * f * 0.02;
n.vy += dy * f * 0.02;
}
}

/* bright quantum dots */
ctx.beginPath();
ctx.fillStyle="rgba(120,220,255,0.95)";
ctx.shadowBlur=12;
ctx.shadowColor="#66ccff";
ctx.arc(n.x,n.y,1.6,0,Math.PI*2);
ctx.fill();

}

/* ripple expand */
for(let r of ripples){
r.r += 6;

ctx.beginPath();
ctx.strokeStyle="rgba(120,200,255,0.3)";
ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
ctx.stroke();
}

/* cleanup */
for(let i=ripples.length-1;i>=0;i--){
if(ripples[i].r > 400) ripples.splice(i,1);
}

requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
