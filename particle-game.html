<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Particle Detector</title>

<style>

@font-face {
    font-family: 'Carbon';
    src: url('./fonts/HoneyRoom.ttf') format('truetype');
}

/* ⚛️ GLOBAL FONT */
* {
    font-family: 'Carbon', sans-serif;
    margin:0;
    padding:0;
    box-sizing:border-box;
    overflow:hidden;
}

body{
    background:black;
    color:white;
}

/* CANVAS */
canvas{
    position:absolute;
    top:0;
    left:0;
}

/* HUD */
#hud{
    position:absolute;
    top:20px;
    left:20px;
    border:2px solid white;
    padding:12px 18px;
    background:rgba(0,0,0,0.5);
    z-index:10;
}

/* TITLE */
#title{
    position:absolute;
    top:20px;
    right:20px;
    font-size:28px;
}

/* MENU */
#menu{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    z-index:20;
}

button{
    border:2px solid white;
    background:black;
    color:white;
    padding:18px 40px;
    font-size:24px;
    cursor:pointer;
}

/* GAMEOVER */
#gameover{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,0.95);
    z-index:30;
    text-align:center;
}

#gameover h1{
    font-size:40px;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div id="menu">
    <button onclick="startGame()">START DETECTOR</button>
</div>

<div id="hud">
TIME: <span id="timer">30</span><br><br>
U QUARK: <span id="u">0</span><br>
D QUARK: <span id="d">0</span><br>
ELECTRON: <span id="e">0</span>
</div>

<div id="title">⚛ DRAVYA</div>

<div id="gameover">
    <h1>LEVEL COMPLETE ⚛</h1>
    <div id="summary"></div>
    <button onclick="startLevel2()">START LEVEL 2</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

/* AUDIO */
const bgMusic = new Audio("./assets/untitled.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.4;

const catchSound = new Audio("./assets/hit.mp3");
catchSound.volume = 0.7;

/* STATE */
let particles = [];
let score;
let running = false;
let timer = 30;

let detector = {x:0,y:0,w:120,h:120};
let targetX = 0;

/* MOUSE */
document.addEventListener("mousemove",(e)=>{
    targetX = e.clientX;
});

/* RESET */
function reset(){
    particles = [];
    score = {u:0,d:0,e:0};
    timer = 30;

    detector = {
        x:window.innerWidth/2,
        y:window.innerHeight-160,
        w:120,
        h:120
    };

    document.getElementById("u").innerText=0;
    document.getElementById("d").innerText=0;
    document.getElementById("e").innerText=0;
}

/* SPAWN */
function spawnParticle(){
    particles.push({
        x:Math.random()*window.innerWidth,
        y:-20,
        r:12,
        actual:["u","d","e"][Math.floor(Math.random()*3)],
        speed:2+Math.random()*3,
        glow:0
    });
}

/* UPDATE */
function update(){

    detector.x += (targetX - detector.x)*0.08;

    particles.forEach((p,i)=>{

        p.y += p.speed;

        let left = detector.x - detector.w/2;
        let right = detector.x + detector.w/2;
        let top = detector.y;

        if(p.x>left && p.x<right && p.y>top){

            score[p.actual]++;
            document.getElementById(p.actual).innerText = score[p.actual];

            p.glow = 30;

            catchSound.currentTime=0;
            catchSound.play();

            particles.splice(i,1);
        }

        if(p.y>window.innerHeight) particles.splice(i,1);
    });
}

/* BACKGROUND GRID */
function drawBackground(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle="rgba(255,255,255,0.08)";
    ctx.lineWidth=1;

    let gap=50;

    for(let x=0;x<canvas.width;x+=gap){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=0;y<canvas.height;y+=gap){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}

/* DETECTOR (SQUARE) */
function drawDetector(){
    ctx.strokeStyle="white";
    ctx.lineWidth=3;
    ctx.strokeRect(
        detector.x-detector.w/2,
        detector.y,
        detector.w,
        detector.h
    );
}

/* PARTICLES */
function drawParticles(){

    particles.forEach(p=>{

        if(p.glow>0){
            ctx.shadowBlur=40;
            ctx.shadowColor="white";
            p.glow--;
        } else {
            ctx.shadowBlur=0;
        }

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
    });
}

/* LOOP */
function loop(){
    if(!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
}

/* DRAW */
function draw(){
    drawBackground();
    drawDetector();
    drawParticles();
}

/* END */
function endGame(){
    running=false;
    bgMusic.pause();

    document.getElementById("gameover").style.display="flex";

    document.getElementById("summary").innerHTML=`
        U: ${score.u}<br>
        D: ${score.d}<br>
        E: ${score.e}<br><br>
        <b>Ready for nucleon building ⚛</b>
    `;
}

/* LEVEL 2 */
function startLevel2(){
    reset();
    running=true;
    document.getElementById("gameover").style.display="none";
    bgMusic.play();
    loop();
}

/* START */
function startGame(){
    reset();
    running=true;
    document.getElementById("menu").style.display="none";
    document.getElementById("gameover").style.display="none";
    bgMusic.play();
    loop();
}

/* TIMER */
setInterval(()=>{
    if(running){
        timer--;
        document.getElementById("timer").innerText=timer;
        if(timer<=0) endGame();
    }
},1000);

/* SPAWN */
setInterval(()=>{
    if(running) spawnParticle();
},300);

</script>

</body>
</html>
