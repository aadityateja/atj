<style>

/* =========================
   FONT
========================= */

@font-face{
    font-family:'Carbon';
    src:url('./fonts/HoneyRoom.ttf')
    format('truetype');
}

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Carbon',sans-serif;
}

body{

    background:black;
    color:white;

    width:100vw;
    height:100vh;

    overflow:hidden;

    animation:fadeIn 1.5s ease;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

@keyframes pulse{

    0%{
        text-shadow:0 0 5px white;

    50%{

    }

@keyframes quantumSpin{

        transform:rotate(360deg);

}

/* =========================
   CANVAS
========================= */

canvas{

}

   HUD

    0 0 20px rgba(255,255,255,0.05);

   MENU

button{

   INVENTORY

    animation:quantumSpin 3s linear infinite;

    0 0 25px rgba(255,255,255,0.2);
}

   FUSION CHAMBER
========================= */

#nucleonChamber{

    margin-top:50px;

}

#fusionCircle{

    0 0 50px rgba(255,255,255,0.12);

#fusionCircle.active{

/* =========================
   RESULTS

#fusionResult{

}

   STATS
========================= */

#matterStats{

    margin-top:40px;

    display:flex;

    flex-wrap:wrap;

}

/* =========================
   MOBILE

@media(max-width:768px){

    #hud{

        top:10px;

        min-width:140px;

        font-size:14px;
    }

    #title{

        top:10px;
        right:10px;

    }

    #inventory{

        flex-direction:column;

        width:90%;

    #fusionCircle{

        width:180px;

    #matterStats{

        flex-direction:column;

    }

    }
}

/* =========================
   FORCE DESKTOP
========================= */

.forceDesktop{

    min-width:1400px;
}

</style>

<body>

<!-- MENU -->

<div id="menu">

    <button onclick="startGame()">
        START DETECTOR ⚛
    </button>

</div>

<!-- HUD -->

<div id="hud">

TIME:
<span id="timer">30</span>

<br><br>

U QUARK:
<span id="u">0</span>

<br>

D QUARK:
<span id="d">0</span>

<br>

ELECTRON:
<span id="e">0</span>

</div>

<!-- TITLE -->

<div id="title">

⚛ DRAVYA

</div>

<!-- DESKTOP BUTTON -->

<button id="desktopModeBtn"
onclick="toggleDesktopMode()">

DESKTOP MODE

</button>

<!-- LEVEL 2 -->

<div id="gameover">

    <h1>
        NUCLEON CONSTRUCTION ⚛
    </h1>

    <!-- INVENTORY -->

    <div id="inventory">

        <div class="particleBox"
        onclick="selectParticle('u')">

            <h2>UP QUARK</h2>

            <div id="uCount">0</div>

        </div>

        <div class="particleBox"
        onclick="selectParticle('d')">

            <h2>DOWN QUARK</h2>

            <div id="dCount">0</div>

        </div>

        <div class="particleBox"
        onclick="selectParticle('e')">

            <h2>ELECTRON</h2>

            <div id="eCount">0</div>

        </div>

    </div>

    <!-- SELECTED -->

    <div id="selectedArea">

        <h2>
            SELECTED PARTICLES
        </h2>

        <div id="selectedParticles"></div>

    </div>

    <!-- FUSION -->

    <div id="nucleonChamber">

        <div id="fusionCircle">

            ⚛

        </div>

    </div>

    <!-- RESULT -->

    <div id="fusionResult"></div>

    <!-- STATS -->

    <div id="matterStats">

        <div>
            PROTONS:
            <span id="protonCount">0</span>
        </div>

        <div>
            NEUTRONS:
            <span id="neutronCount">0</span>
        </div>

        <div>
            FREE QUARKS:
            <span id="freeQuarks">0</span>
        </div>

    </div>

    <br><br>

    <button onclick="restartGame()">

        RESTART DETECTOR

    </button>

</div>

<!-- CANVAS -->

<canvas id="game"></canvas>

<script>

/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

/* =========================
   AUDIO
========================= */

const bgMusic =
new Audio("./assets/untitled.mp3");

bgMusic.loop = true;

bgMusic.volume = 0.4;

const catchSound =
new Audio("./assets/hit.mp3");

catchSound.volume = 0.7;

/* =========================
   STATE
========================= */

let particles = [];

let running = false;

let timer = 30;

let score;

let detector = {};

let targetX =
window.innerWidth/2;

let selectedParticles = [];

let protons = 0;

let neutrons = 0;

/* =========================
   CONTROLS
========================= */

document.addEventListener(
"mousemove",
(e)=>{

    targetX = e.clientX;
});

document.addEventListener(
"touchmove",
(e)=>{

    targetX =
    e.touches[0].clientX;

},{passive:true});

/* =========================
   RESET
========================= */

function reset(){

    particles = [];

    selectedParticles = [];

    protons = 0;

    neutrons = 0;

    score = {

        u:0,
        d:0,
        e:0
    };

    timer = 30;

    const isMobile =
    window.innerWidth < 768;

    detector = {

        x:window.innerWidth/2,

        y:window.innerHeight -
        (isMobile ? 120 : 160),

        w:isMobile ? 90 : 120,

        h:isMobile ? 90 : 120,

        flash:0
    };

    document.getElementById("u")
    .innerText = 0;

    document.getElementById("d")
    .innerText = 0;

    document.getElementById("e")
    .innerText = 0;

    document.getElementById("timer")
    .innerText = timer;
}

/* =========================
   SPAWN
========================= */

function spawnParticle(){

    particles.push({

        x:Math.random()
        *window.innerWidth,

        y:-20,

        r:12,

        actual:
        ["u","d","e"]
        [Math.floor(
        Math.random()*3)],

        speed:
        2 + Math.random()*3,

        glow:0,

        phase:
        Math.random()
        *Math.PI*2
    });
}

/* =========================
   UPDATE
========================= */

function update(){

    detector.x +=
    (targetX-detector.x)*0.1;

    particles.forEach((p,i)=>{

        p.y += p.speed;

        let left =
        detector.x-detector.w/2;

        let right =
        detector.x+detector.w/2;

        let top =
        detector.y;

        if(

            p.x > left &&
            p.x < right &&
            p.y > top

        ){

            score[p.actual]++;

            document.getElementById(
            p.actual
            ).innerText =
            score[p.actual];

            detector.flash = 8;

            catchSound.currentTime=0;

            catchSound.play();

            particles.splice(i,1);
        }

        if(
            p.y >
            window.innerHeight
        ){

            particles.splice(i,1);
        }
    });
}

/* =========================
   BACKGROUND
========================= */

function drawBackground(){

    ctx.fillStyle="black";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let gap = 60;

    let time =
    Date.now()*0.0004;

    ctx.strokeStyle =
    "rgba(255,255,255,0.08)";

    ctx.lineWidth = 1;

    /* VERTICAL */

    for(

        let x=-200;

        x<canvas.width+200;

        x+=gap

    ){

        ctx.beginPath();

        for(

            let y=0;

            y<canvas.height;

            y+=10

        ){

            let wave =
            Math.sin(
            y*0.01+time
            )*20;

            ctx.lineTo(
                x+wave,
                y
            );
        }

        ctx.stroke();
    }

    /* HORIZONTAL */

    for(

        let y=-200;

        y<canvas.height+200;

        y+=gap

    ){

        ctx.beginPath();

        for(

            let x=0;

            x<canvas.width;

            x+=10

        ){

            let wave =
            Math.cos(
            x*0.01+time
            )*20;

            ctx.lineTo(
                x,
                y+wave
            );
        }

        ctx.stroke();
    }
}

/* =========================
   DETECTOR
========================= */

function drawDetector(){

    ctx.shadowBlur = 20;

    ctx.shadowColor = "white";

    if(detector.flash > 0){

        ctx.fillStyle="white";

        ctx.fillRect(

            detector.x
            -detector.w/2,

            detector.y,

            detector.w,

            detector.h
        );

        detector.flash--;

    } else {

        ctx.strokeStyle="white";

        ctx.lineWidth=3;

        ctx.strokeRect(

            detector.x
            -detector.w/2,

            detector.y,

            detector.w,

            detector.h
        );
    }

    ctx.shadowBlur = 0;
}

/* =========================
   PARTICLES
========================= */

function drawParticles(){

    particles.forEach((p)=>{

        let wave =
        Math.sin(
        Date.now()*0.01
        +p.phase
        );

        let offset =
        wave*8;

        let hue =
        (
            Date.now()*0.1
            +p.phase*100
        )%360;

        ctx.fillStyle =
        `hsl(${hue},100%,70%)`;

        /* SUPERPOSITION */

        ctx.globalAlpha = 0.25;

        ctx.beginPath();

        ctx.arc(
            p.x-offset,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            p.x+offset,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        /* REAL */

        ctx.globalAlpha = 1;

        ctx.shadowBlur = 25;

        ctx.shadowColor =
        `hsl(${hue},100%,70%)`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        /* LABEL */

        ctx.fillStyle="white";

        ctx.font="16px Carbon";

        ctx.fillText(

            p.actual,

            p.x-4,

            p.y+5
        );
    });

    ctx.globalAlpha = 1;
}

/* =========================
   DRAW
========================= */

function draw(){

    drawBackground();

    drawDetector();

    drawParticles();
}

/* =========================
   LOOP
========================= */

function loop(){

    if(!running) return;

    update();

    draw();

    requestAnimationFrame(loop);
}

/* =========================
   START
========================= */

function startGame(){

    reset();

    running = true;

    document.getElementById(
    "menu"
    ).style.display="none";

    document.getElementById(
    "gameover"
    ).style.display="none";

    bgMusic.play();

    loop();
}

/* =========================
   END GAME
========================= */

function endGame(){

    running = false;

    bgMusic.pause();

    document.getElementById(
    "gameover"
    ).style.display="flex";

    updateInventory();
}

/* =========================
   INVENTORY
========================= */

function updateInventory(){

    document.getElementById(
    "uCount"
    ).innerText = score.u;

    document.getElementById(
    "dCount"
    ).innerText = score.d;

    document.getElementById(
    "eCount"
    ).innerText = score.e;

    document.getElementById(
    "freeQuarks"
    ).innerText =
    score.u + score.d;
}

/* =========================
   SELECT PARTICLE
========================= */

function selectParticle(type){

    if(
        selectedParticles
        .length >= 3
    ) return;

    if(score[type] <= 0) return;

    score[type]--;

    updateInventory();

    selectedParticles.push(type);

    renderSelected();

    if(
        selectedParticles
        .length === 3
    ){

        activateFusion();
    }
}

/* =========================
   RENDER SELECTED
========================= */

function renderSelected(){

    const container =
    document.getElementById(
    "selectedParticles"
    );

    container.innerHTML = "";

    selectedParticles.forEach(
    (p)=>{

        let div =
        document.createElement(
        "div"
        );

        div.className =
        "selectedParticle";

        div.innerText = p;

        div.style.color =
        ["red","cyan","lime"]
        [Math.floor(
        Math.random()*3)];

        container
        .appendChild(div);
    });
}

/* =========================
   FUSION
========================= */

function activateFusion(){

    const fusion =
    document.getElementById(
    "fusionCircle"
    );

    fusion.classList
    .add("active");

    setTimeout(()=>{

        checkNucleon();

        fusion.classList
        .remove("active");

    },900);
}

/* =========================
   CHECK NUCLEON
========================= */

function checkNucleon(){

    let sorted =
    [...selectedParticles]
    .sort()
    .join("");

    let result = "";

    if(sorted === "duu"){

        protons++;

        result =
        "⚛ PROTON CREATED";
    }

    else if(sorted === "ddu"){

        neutrons++;

        result =
        "⚛ NEUTRON CREATED";
    }

    else{

        result =
        "⚠ INVALID HADRON";
    }

    document.getElementById(
    "fusionResult"
    ).innerText = result;

    document.getElementById(
    "protonCount"
    ).innerText = protons;

    document.getElementById(
    "neutronCount"
    ).innerText = neutrons;

    selectedParticles = [];

    renderSelected();

    updateInventory();
}

/* =========================
   RESTART
========================= */

function restartGame(){

    startGame();
}

/* =========================
   DESKTOP MODE
========================= */

function toggleDesktopMode(){

    document.body
    .classList
    .toggle("forceDesktop");
}

/* =========================
   TIMER
========================= */

setInterval(()=>{

    if(running){

        timer--;

        document.getElementById(
        "timer"
        ).innerText = timer;

        if(timer <= 0){

            endGame();
        }
    }

},1000);

/* =========================
   SPAWN LOOP
========================= */

setInterval(()=>{

    if(running){

        spawnParticle();
    }

},300);

</script>

</body>
</html>
