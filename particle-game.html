<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Particle Game</title>
</head>

<body>

<h1>⚛️ Particle Catcher</h1>

<div id="menu">
<button onclick="startGame()">Start</button>
</div>

<div id="hud">
Time: <span id="timer">30</span><br>
u: <span id="u">0</span> |
d: <span id="d">0</span> |
e: <span id="e">0</span>
</div>

<canvas id="game" width="800" height="500"></canvas>

<div id="over" style="display:none;">
Game Over
</div>

<script>

const c = document.getElementById("game");
const ctx = c.getContext("2d");

const bgMusic = new Audio("./assets/untitled.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.4;

const catchSound = new Audio("./assets/hit.mp3");
catchSound.volume = 0.7;

let player, particles, score;
let time = 30;
let running = false;
let targetX = 350;

document.addEventListener("mousemove", (e)=>{
    let rect = c.getBoundingClientRect();
    targetX = e.clientX - rect.left;
});

function reset(){
    player = {x:350,y:450,w:100,h:20};
    particles = [];
    score = {u:0,d:0,e:0};

    u.innerText = 0;
    d.innerText = 0;
    e.innerText = 0;
}

function spawn(){
    const t = ["u","d","e"];
    particles.push({
        x:Math.random()*760,
        y:0,
        t:t[Math.floor(Math.random()*3)],
        s:2+Math.random()*3
    });
}

function update(){
    player.x += (targetX - player.x)*0.2;
    player.x = Math.max(0, Math.min(700, player.x));

    for(let i=particles.length-1;i>=0;i--){
        let p = particles[i];
        p.y += p.s;

        if(
            p.x > player.x &&
            p.x < player.x + player.w &&
            p.y > player.y
        ){
            score[p.t]++;
            document.getElementById(p.t).innerText = score[p.t];

            catchSound.currentTime = 0;
            catchSound.play();

            particles.splice(i,1);
        }

        if(p.y > 500) particles.splice(i,1);
    }
}

function draw(){
    ctx.clearRect(0,0,800,500);

    ctx.fillStyle="white";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    particles.forEach(p=>{
        ctx.fillStyle = p.t==="u"?"blue":p.t==="d"?"green":"orange";
        ctx.beginPath();
        ctx.arc(p.x,p.y,15,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.fillText(p.t,p.x-5,p.y+5);
    });
}

function startGame(){

    menu.style.display="none";
    hud.style.display="block";

    reset();
    running=true;

    bgMusic.currentTime=0;
    bgMusic.play();

    setInterval(()=>{ if(running){update();draw();} },16);
    setInterval(()=>{ if(running) spawn(); },700);

    setInterval(()=>{
        if(running){
            time--;
            timer.innerText=time;

            if(time<=0){
                running=false;
                bgMusic.pause();
            }
        }
    },1000);
}

</script>

</body>
</html>
