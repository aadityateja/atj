<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Particle Detector</title>

<style>

    @font-face {
    font-family: 'Carbon';
    src: url('./fonts/HoneyRoom.ttf') format('truetype');
}

    * {
    font-family: 'Carbon', sans-serif;
}
    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    overflow:hidden;
}

body{
    background:black;
    color:white;
}

/* CANVAS */
canvas{
    position:absolute;
    top:0;
    left:0;
}

/* HUD */
#hud{
    position:absolute;
    top:20px;
    left:20px;
    border:4px solid white;
    padding:12px 18px;
    background:rgba(0,0,0,0.5);
    z-index:10;
    font-size:18px;
    line-height:1.6;
}

/* TITLE */
#title{
    position:absolute;
    top:20px;
    right:20px;
    font-size:28px;
    letter-spacing:2px;
    z-index:10;
}

/* MENU */
#menu{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    z-index:20;
}

button{
    border:4px solid white;
    background:black;
    color:white;
    padding:18px 40px;
    font-size:28px;
    cursor:pointer;
}

/* GAMEOVER */
#gameover{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,0.95);
    z-index:30;
    text-align:center;
}

#gameover h1{
    font-size:50px;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div id="menu">
    <button onclick="startGame()">START DETECTOR</button>
</div>

<div id="hud">
TIME: <span id="timer">30</span><br><br>
UP QUARK : <span id="u">0</span><br>
DOWN QUARK : <span id="d">0</span><br>
ELECTRON : <span id="e">0</span>
</div>

<div id="title">⚛ DRAVYA</div>

<div id="gameover">
    <h1>DAMN! WE'VE GOT SOME QUARKS AND LEPTONS!
    LET'S BUILD THE NUCLEONS</h1>
    <div id="summary"></div>
    <br>
    <button onclick="startGame()">RESTART</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

/* AUDIO */
const bgMusic = new Audio("./assets/untitled.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.4;

const catchSound = new Audio("./assets/hit.mp3");
catchSound.volume = 0.7;

/* GAME STATE */
let particles = [];
let stars = [];
let score;
let running = false;
let timer = 30;

let revealText = "";
let revealTimer = 0;

let detector = {x:0,y:0,w:240,h:120};
let targetX = 0;

/* STARS */
for(let i=0;i<120;i++){
    stars.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        r:Math.random()*2
    });
}

/* MOUSE */
document.addEventListener("mousemove",(e)=>{
    targetX = e.clientX;
});

/* RESET */
function reset(){

    particles = [];

    score = {u:0,d:0,e:0};

    timer = 30;

    detector = {
        x:window.innerWidth/2,
        y:window.innerHeight-140,
        w:240,
        h:120
    };

    document.getElementById("u").innerText=0;
    document.getElementById("d").innerText=0;
    document.getElementById("e").innerText=0;
    document.getElementById("timer").innerText=30;
}

/* SPAWN PARTICLE (SUPERPOSITION) */
function spawnParticle(){

    particles.push({
        x:Math.random()*window.innerWidth,
        y:-20,
        r:14,
        actual:["u","d","e"][Math.floor(Math.random()*3)],
        phase:Math.random()*Math.PI*2,
        speed:2+Math.random()*4,
        trail:[]
    });

}

/* UPDATE */
function update(){

    detector.x += (targetX - detector.x)*0.08;

    particles.forEach((p,i)=>{

        p.y += p.speed;

        p.phase += 0.05;

        p.trail.push({x:p.x,y:p.y});
        if(p.trail.length>12) p.trail.shift();

        let left = detector.x - detector.w/2;
        let right = detector.x + detector.w/2;

        if(
            p.x > left+30 &&
            p.x < right-30 &&
            p.y > detector.y
        ){

            let real = p.actual;

            score[real]++;

            document.getElementById(real).innerText = score[real];

            revealText = real.toUpperCase();
            revealTimer = 60;

            catchSound.currentTime=0;
            catchSound.play();

            particles.splice(i,1);

        }

        if(p.y > window.innerHeight+50){
            particles.splice(i,1);
        }

    });

}

/* DRAW BACKGROUND */
function drawBackground(){

    ctx.fillStyle="black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    stars.forEach(s=>{
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });

}

/* DETECTOR (WELL SHAPE) */
function drawDetector(){

    let x = detector.x;
    let y = detector.y;

    ctx.strokeStyle="white";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(x-130,y);
    ctx.quadraticCurveTo(x-80,y+90,x,y+110);
    ctx.quadraticCurveTo(x+80,y+90,x+130,y);

    ctx.stroke();

}

/* PARTICLES */
function drawParticles(){

    particles.forEach(p=>{

        let r = 120 + 120*Math.sin(p.phase);
        let g = 120 + 120*Math.sin(p.phase+2);
        let b = 120 + 120*Math.sin(p.phase+4);

        let col = `rgb(${r},${g},${b})`;

        ctx.shadowBlur=25;
        ctx.shadowColor=col;

        ctx.fillStyle=col;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        ctx.shadowBlur=0;

        /* trail */
        for(let i=0;i<p.trail.length;i++){
            let t = p.trail[i];
            ctx.fillStyle=`rgba(255,255,255,${i/p.trail.length*0.2})`;
            ctx.beginPath();
            ctx.arc(t.x,t.y,3,0,Math.PI*2);
            ctx.fill();
        }

        ctx.fillStyle="white";
        ctx.font="14px Arial";
        ctx.fillText("?",p.x-4,p.y+5);

    });

}

/* REVEAL TEXT */
function drawReveal(){

    if(revealTimer>0){

        ctx.fillStyle="white";
        ctx.font="40px Carbon";
        ctx.textAlign="center";

        ctx.fillText(
            "IDENTIFIED: " + revealText,
            canvas.width/2,
            120
        );

        revealTimer--;

    }

}

/* MAIN DRAW */
function draw(){

    drawBackground();
    drawDetector();
    drawParticles();
    drawReveal();

}

/* LOOP */
function loop(){

    if(!running) return;

    update();
    draw();

    requestAnimationFrame(loop);

}

/* GAME END */
function endGame(){

    running=false;

    bgMusic.pause();

    let proton = Math.floor(score.u / 2);
let neutron = Math.floor(score.d / 2);

document.getElementById("summary").innerHTML = `
    U: ${score.u}<br>
    D: ${score.d}<br>
    E: ${score.e}<br><br>

    <b>Level 2 Unlock:</b><br>
    Protons possible: ${proton}<br>
    Neutrons possible: ${neutron}
`;
    function buildProton(u, d){
    if(u >= 2 && d >= 1){
        return "PROTON CREATED ⚛️";
    }
    return "INSUFFICIENT QUARKS";
}
}

/* START */
function startGame(){

    reset();

    running=true;

    document.getElementById("menu").style.display="none";
    document.getElementById("gameover").style.display="none";

    bgMusic.currentTime=0;
    bgMusic.play();

    loop();

}

/* SPAWN */
setInterval(()=>{
    if(running) spawnParticle();
},300);

/* TIMER */
setInterval(()=>{
    if(running){
        timer--;
        document.getElementById("timer").innerText=timer;
        if(timer<=0) endGame();
    }
},1000);

</script>

</body>
</html>
