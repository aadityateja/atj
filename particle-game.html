<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Particle Game</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    background: #111;
    color: white;
}

canvas {
    border: 2px solid white;
    background: black;
    display: block;
    margin: auto;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin: 10px;
}
</style>
</head>

<body>

<h1>⚛️ Particle Catcher</h1>

<div id="menu">
    <button onclick="startGame()">Start Game</button>
</div>

<div id="hud" style="display:none;">
    <p>⏱ Time: <span id="timer">10</span></p>
    <p>
        u: <span id="u">0</span> |
        d: <span id="d">0</span> |
        e: <span id="e">0</span>
    </p>
</div>

<canvas id="game" width="800" height="500"></canvas>

<div id="over" style="display:none;">
    <h2>Game Over</h2>
    <p id="score"></p>
    <button onclick="location.reload()">Play Again</button>
</div>

<script>

const c = document.getElementById("game");
const ctx = c.getContext("2d");

let player, particles, score;
let keys = {};
let time = 10;
let running = false;

document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

function reset(){
    player = {x:350,y:450,w:100,h:20};
    particles = [];
    score = {u:0,d:0,e:0};

    document.getElementById("u").innerText=0;
    document.getElementById("d").innerText=0;
    document.getElementById("e").innerText=0;
}

function spawn(){
    let types=["u","d","e"];

    particles.push({
        x:Math.random()*760,
        y:0,
        t:types[Math.floor(Math.random()*3)],
        s:2+Math.random()*3
    });
}

function update(){
    if(keys["ArrowLeft"]) player.x-=6;
    if(keys["ArrowRight"]) player.x+=6;

    player.x=Math.max(0,Math.min(700,player.x));

    for(let i=particles.length-1;i>=0;i--){
        let p=particles[i];
        p.y+=p.s;

        if(
            p.x>player.x &&
            p.x<player.x+player.w &&
            p.y>player.y
        ){
            score[p.t]++;
            document.getElementById(p.t).innerText=score[p.t];
            particles.splice(i,1);
        }

        if(p.y>500) particles.splice(i,1);
    }
}

function draw(){
    ctx.clearRect(0,0,800,500);

    ctx.fillStyle="white";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    particles.forEach(p=>{
        ctx.fillStyle =
            p.t==="u"?"blue":
            p.t==="d"?"green":"orange";

        ctx.beginPath();
        ctx.arc(p.x,p.y,15,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.fillText(p.t,p.x-5,p.y+5);
    });
}

function startGame(){
    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="block";

    reset();
    running=true;

    setInterval(()=>{
        if(running){update();draw();}
    },16);

    setInterval(()=>{
        if(running) spawn();
    },700);

    let t=setInterval(()=>{
        if(running){
            time--;
            document.getElementById("timer").innerText=time;

            if(time<=0){
                running=false;
                clearInterval(t);

                document.getElementById("hud").style.display="none";
                document.getElementById("over").style.display="block";

                document.getElementById("score").innerHTML=
                `u=${score.u}<br>d=${score.d}<br>e=${score.e}`;
            }
        }
    },1000);
}

</script>

</body>
</html>
