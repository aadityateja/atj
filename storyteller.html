<!DOCTYPE html>
<html>
<head>
<title>Aditya's Physics Journey</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:monospace;
}

canvas{
    display:block;
}

#info{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:18px;
    z-index:10;
}
</style>

</head>


<body>


<div id="info">
← → Move | SPACE Jump
</div>


<canvas id="game"></canvas>


<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=window.innerWidth;
canvas.height=window.innerHeight;



let keys={};


document.addEventListener("keydown",e=>{

keys[e.code]=true;

});


document.addEventListener("keyup",e=>{

keys[e.code]=false;

});



// WORLD

let camera=0;


let player={

x:200,
y:400,
vx:0,
vy:0,
width:30,
height:50,
ground:false

};



let gravity=0.7;



let worldWidth=9000;




// TIME

let scene="night";



function updateScene(){


if(player.x<2500)
scene="night";


else if(player.x<4500)
scene="physics";


else if(player.x<7000)
scene="ramaiah";


else
scene="stars";


}





// PLAYER


function updatePlayer(){


player.vx=0;


if(keys["ArrowRight"])
player.vx=5;


if(keys["ArrowLeft"])
player.vx=-5;



if(keys["Space"] && player.ground)
{
player.vy=-15;
player.ground=false;
}



player.x+=player.vx;

player.y+=player.vy;


player.vy+=gravity;



let ground=canvas.height-120;


if(player.y+player.height>ground)
{

player.y=ground-player.height;

player.vy=0;

player.ground=true;

}



camera=player.x-300;


if(camera<0)
camera=0;


}




// DRAW BACKGROUND


function sky(){


if(scene=="night")
{

let g=ctx.createLinearGradient(0,0,0,canvas.height);

g.addColorStop(0,"#020617");

g.addColorStop(1,"#111827");

ctx.fillStyle=g;

ctx.fillRect(0,0,canvas.width,canvas.height);


// moon

ctx.fillStyle="#eee";

ctx.beginPath();

ctx.arc(800,120,40,0,Math.PI*2);

ctx.fill();


}


else if(scene=="physics")
{

let g=ctx.createLinearGradient(0,0,0,canvas.height);

g.addColorStop(0,"#ff9966");

g.addColorStop(1,"#87ceeb");

ctx.fillStyle=g;

ctx.fillRect(0,0,canvas.width,canvas.height);


// sun

ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(800,120,50,0,Math.PI*2);

ctx.fill();


}



else if(scene=="ramaiah")
{

ctx.fillStyle="#87ceeb";

ctx.fillRect(0,0,canvas.width,canvas.height);


}



else{


ctx.fillStyle="#020617";

ctx.fillRect(0,0,canvas.width,canvas.height);


stars();


}


}




function stars(){


for(let i=0;i<100;i++)
{

ctx.fillStyle="white";

ctx.fillRect(
Math.random()*canvas.width,
Math.random()*300,
2,
2
);

}


}






// OFFICE


function office(){


let start=0-camera;


ctx.fillStyle="#222";

ctx.fillRect(start,250,700,250);



// windows


for(let x=0;x<700;x+=70)
{

ctx.fillStyle="#334155";

ctx.fillRect(start+x,280,50,70);


}



// workers


for(let i=0;i<6;i++)
{

ctx.fillStyle="#64748b";

ctx.fillRect(
start+80+i*100,
420,
50,
40
);


ctx.fillStyle="#f1c27d";

ctx.beginPath();

ctx.arc(
start+105+i*100,
390,
15,
0,
Math.PI*2
);

ctx.fill();


}


}





// COLLEGE


function college(){


let x=3000-camera;


ctx.fillStyle="#f8fafc";

ctx.fillRect(x,200,600,300);



ctx.fillStyle="black";

ctx.font="30px monospace";

ctx.fillText(
"B.Sc PHYSICS",
x+120,
280
);



// electrons

for(let i=0;i<5;i++)
{

ctx.strokeStyle="#00ffff";

ctx.beginPath();

ctx.arc(
x+300,
350,
60+i*15,
0,
Math.PI*2
);

ctx.stroke();

}


}





// RAMAIAH


function ramaiah(){


let x=5000-camera;


ctx.fillStyle="#ddd";

ctx.fillRect(x,180,700,320);



ctx.fillStyle="black";

ctx.font="30px monospace";


ctx.fillText(
"RAMAIAH UNIVERSITY",
x+80,
260
);


ctx.fillText(
"MSc NUCLEAR PHYSICS",
x+80,
320
);


ctx.fillStyle="#00ffff";


ctx.beginPath();

ctx.arc(x+350,420,50,0,Math.PI*2);

ctx.fill();


ctx.fillStyle="black";

ctx.fillText(
"n → p + e⁻ + ν",
x+100,
450
);



}





// FINAL


function finalScene(){


ctx.fillStyle="white";

ctx.font="40px monospace";


ctx.fillText(
"NAAXATRA",
500-camera,
250
);


ctx.font="25px monospace";


ctx.fillText(
"Looking at stars...",
500-camera,
320
);


}







// CHARACTER


function drawPlayer(){


let x=player.x-camera;


ctx.fillStyle="#2563eb";

ctx.fillRect(
x,
player.y,
30,
50
);


// head

ctx.fillStyle="#f1c27d";

ctx.beginPath();

ctx.arc(
x+15,
player.y-10,
15,
0,
Math.PI*2
);

ctx.fill();



}




// TEXT


function timelineText(){


ctx.fillStyle="white";

ctx.font="24px monospace";


let text="";


if(scene=="night")
text="2020 | Night shifts | Searching for physics";


if(scene=="physics")
text="Physics returned | Electrons, mathematics, curiosity";


if(scene=="ramaiah")
text="2024-2026 | MSc Nuclear Physics | Detector science";


if(scene=="stars")
text="2026 | Naxxatra | Building curiosity";


ctx.fillText(text,40,80);


}






function draw(){


ctx.clearRect(0,0,canvas.width,canvas.height);


updateScene();


sky();


if(scene=="night")
office();


if(scene=="physics")
college();


if(scene=="ramaiah")
ramaiah();


if(scene=="stars")
finalScene();



drawPlayer();

timelineText();


}





function loop(){

updatePlayer();

draw();

requestAnimationFrame(loop);

}


loop();



window.onresize=()=>{

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}


</script>


</body>
</html>
