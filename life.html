<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIFE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

#title{
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:40px;
    letter-spacing:10px;
    z-index:10;
    text-shadow:0 0 20px cyan;
    pointer-events:none;
}

canvas{
    display:block;
}

</style>
</head>
<body>

<div id="title">LIFE</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

//////////////////////////////
// SCENE
//////////////////////////////

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000814,0.02);

//////////////////////////////
// CAMERA
//////////////////////////////

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(20,18,20);
camera.lookAt(0,0,0);

//////////////////////////////
// RENDERER
//////////////////////////////

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
window.devicePixelRatio
);

document.body.appendChild(
renderer.domElement
);

//////////////////////////////
// LIGHTS
//////////////////////////////

const ambient = new THREE.AmbientLight(
0xffffff,
1.5
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
0x88ccff,
3
);

sun.position.set(
20,
30,
20
);

scene.add(sun);

//////////////////////////////
// STARS
//////////////////////////////

const starsGeometry =
new THREE.BufferGeometry();

const starsCount = 3000;

const starVertices = [];

for(let i=0;i<starsCount;i++){

starVertices.push(
(Math.random()-0.5)*400,
(Math.random()-0.5)*400,
(Math.random()-0.5)*400
);

}

starsGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(
starVertices,
3
)
);

const starsMaterial =
new THREE.PointsMaterial({
color:0xffffff,
size:0.3
});

const stars =
new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

//////////////////////////////
// FLOATING ISLAND
//////////////////////////////

function createIsland(x,z,color){

const group =
new THREE.Group();

const top =
new THREE.Mesh(
new THREE.CylinderGeometry(
4,
5,
1,
6
),
new THREE.MeshStandardMaterial({
color
})
);

group.add(top);

const bottom =
new THREE.Mesh(
new THREE.ConeGeometry(
3,
5,
6
),
new THREE.MeshStandardMaterial({
color:0x222222
})
);

bottom.position.y=-3;

group.add(bottom);

group.position.set(
x,
0,
z
);

scene.add(group);

return group;

}

const island1 =
createIsland(0,0,0x224466);

const island2 =
createIsland(-12,8,0x334466);

const island3 =
createIsland(12,-8,0x553388);

//////////////////////////////
// CENTRAL CRYSTAL
//////////////////////////////

const crystal =
new THREE.Mesh(
new THREE.OctahedronGeometry(
2,
0
),
new THREE.MeshPhysicalMaterial({
color:0x66ffff,
emissive:0x44ffff,
metalness:0.2,
roughness:0,
transparent:true,
opacity:0.9
})
);

crystal.position.y=4;

scene.add(crystal);

//////////////////////////////
// PARTICLES
//////////////////////////////

const particleGroup =
new THREE.Group();

scene.add(
particleGroup
);

for(let i=0;i<200;i++){

const particle =
new THREE.Mesh(
new THREE.SphereGeometry(
0.05,
8,
8
),
new THREE.MeshBasicMaterial({
color:0x00ffff
})
);

particle.userData.angle =
Math.random()*Math.PI*2;

particle.userData.radius =
3+Math.random()*3;

particle.userData.speed =
0.003+Math.random()*0.01;

particleGroup.add(
particle
);

}

//////////////////////////////
// LOTUS PLACEHOLDER
//////////////////////////////

const lotus =
new THREE.Mesh(
new THREE.TorusGeometry(
2,
0.3,
16,
100
),
new THREE.MeshStandardMaterial({
color:0xff66ff,
emissive:0xaa33ff
})
);

lotus.position.set(
0,
1,
10
);

scene.add(
lotus
);

//////////////////////////////
// ANIMATION
//////////////////////////////

function animate(){

requestAnimationFrame(
animate
);

const t =
performance.now()*0.001;

crystal.rotation.y += 0.01;
crystal.rotation.x += 0.003;

crystal.position.y =
4 +
Math.sin(t*2)*0.3;

lotus.rotation.z += 0.01;

particleGroup.children.forEach(p=>{

p.userData.angle +=
p.userData.speed;

p.position.x =
Math.cos(
p.userData.angle
)*p.userData.radius;

p.position.z =
Math.sin(
p.userData.angle
)*p.userData.radius;

p.position.y =
4 +
Math.sin(
p.userData.angle*3
)*0.5;

});

island1.position.y =
Math.sin(t)*0.2;

island2.position.y =
Math.sin(t+1)*0.3;

island3.position.y =
Math.sin(t+2)*0.25;

stars.rotation.y += 0.0002;

renderer.render(
scene,
camera
);

}

animate();

//////////////////////////////
// RESIZE
//////////////////////////////

window.addEventListener(
'resize',
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
