<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LIFE — Reality Explorer</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

#ui{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
color:white;
z-index:10;
text-align:center;
letter-spacing:4px;
text-shadow:0 0 10px cyan;
}

#info{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
color:#aaa;
z-index:10;
text-align:center;
font-size:14px;
}
</style>
</head>

<body>

<div id="ui">LIFE — REALITY EXPLORER</div>
<div id="info">Click islands to explore consciousness realms</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000010, 20, 80);

////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////
const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(18,14,18);
camera.lookAt(0,0,0);

////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////
// LIGHT
////////////////////////////////////////////////////
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const light = new THREE.PointLight(0x66ccff, 2);
light.position.set(10,20,10);
scene.add(light);

////////////////////////////////////////////////////
// STARS
////////////////////////////////////////////////////
const starGeo = new THREE.BufferGeometry();
const starCount = 2000;
const starPos = [];

for(let i=0;i<starCount;i++){
starPos.push(
(Math.random()-0.5)*200,
(Math.random()-0.5)*200,
(Math.random()-0.5)*200
);
}

starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos,3));

const stars = new THREE.Points(
starGeo,
new THREE.PointsMaterial({color:0xffffff, size:0.2})
);

scene.add(stars);

////////////////////////////////////////////////////
// ISLAND FUNCTION
////////////////////////////////////////////////////
function island(name, x, z, color){

const g = new THREE.Group();

const top = new THREE.Mesh(
new THREE.CylinderGeometry(3,4,1,6),
new THREE.MeshStandardMaterial({color})
);

top.position.y = 0;

g.add(top);

const glow = new THREE.Mesh(
new THREE.SphereGeometry(1.2,16,16),
new THREE.MeshBasicMaterial({color})
);

glow.position.y = 1.5;
g.add(glow);

g.position.set(x,0,z);
g.userData.name = name;

scene.add(g);

return g;
}

////////////////////////////////////////////////////
// REALMS
////////////////////////////////////////////////////
const advaita = island("Advaita", -10, 5, 0x44aaff);
const dvaita = island("Dvaita", 10, -5, 0xff5555);
const vish = island("Vishishtadvaita", 0, -12, 0x55ff88);

////////////////////////////////////////////////////
// CENTRAL LOTUS
////////////////////////////////////////////////////
const lotus = new THREE.Mesh(
new THREE.OctahedronGeometry(2,0),
new THREE.MeshStandardMaterial({
color:0xff66ff,
emissive:0xaa33ff
})
);

lotus.position.set(0,3,0);
scene.add(lotus);

////////////////////////////////////////////////////
// CLICK INTERACTION
////////////////////////////////////////////////////
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click",(e)=>{

mouse.x = (e.clientX/window.innerWidth)*2-1;
mouse.y = -(e.clientY/window.innerHeight)*2+1;

raycaster.setFromCamera(mouse,camera);

const hits = raycaster.intersectObjects(scene.children,true);

if(hits.length>0){

let obj = hits[0].object;

while(obj.parent && !obj.userData.name){
obj = obj.parent;
}

if(obj.userData.name){
alert("Realm: " + obj.userData.name);
}
}

});

////////////////////////////////////////////////////
// ANIMATION LOOP
////////////////////////////////////////////////////
function animate(){

requestAnimationFrame(animate);

const t = performance.now()*0.001;

// lotus pulse
lotus.rotation.y += 0.01;
lotus.position.y = 3 + Math.sin(t)*0.5;

// floating islands
advaita.position.y = Math.sin(t)*0.3;
dvaita.position.y = Math.sin(t+1)*0.3;
vish.position.y = Math.sin(t+2)*0.3;

// slow star rotation
stars.rotation.y += 0.0002;

// render
renderer.render(scene,camera);

}

animate();

////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
