<!DOCTYPE html>
<html>
<head>
<title>Jungle Castle Adventure</title>

<style>
body{
    margin:0;
    background:#111;
    text-align:center;
    font-family:Arial;
}

canvas{
    background:#7ddcff;
    border:4px solid black;
    margin-top:20px;
}

h2{
    color:white;
}
</style>

</head>

<body>

<h2>Jungle Castle Adventure</h2>
<p style="color:white">
Arrow Keys = Move | Space = Jump | Reach the Castle
</p>

<canvas id="game" width="900" height="400"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let keys={};

document.addEventListener("keydown",e=>{
    keys[e.code]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.code]=false;
});


let level=1;
let win=false;

let camera=0;


let player={
    x:100,
    y:300,
    w:30,
    h:40,
    vx:0,
    vy:0,
    speed:5,
    jump:-14,
    ground:false
};


let gravity=0.7;



let rocks=[
 {x:400,y:350,w:30,h:30},
 {x:650,y:350,w:30,h:30},
 {x:1000,y:350,w:30,h:30}
];


let castle={
    x:1300,
    y:220,
    w:120,
    h:130
};


let treasure={
    x:700,
    y:300,
    collected:false
};



function update(){


if(win)return;



// movement

if(keys["ArrowRight"]){
    player.vx=player.speed;
}

else if(keys["ArrowLeft"]){
    player.vx=-player.speed;
}

else{
    player.vx=0;
}



player.x+=player.vx;


// jump

if(keys["Space"] && player.ground){

    player.vy=player.jump;
    player.ground=false;

}



player.vy+=gravity;

player.y+=player.vy;



// ground

if(player.y+player.h>=350){

    player.y=350-player.h;
    player.vy=0;
    player.ground=true;

}




// level 1 castle

if(level==1){

    if(player.x+player.w>castle.x){

        level=2;

        player.x=100;
        player.y=300;

    }

}



// level 2 treasure

if(level==2){

    if(
    player.x<treasure.x+30 &&
    player.x+player.w>treasure.x &&
    player.y<treasure.y+30 &&
    player.y+player.h>treasure.y
    ){

        treasure.collected=true;
        win=true;

    }

}



camera=player.x-300;

if(camera<0)camera=0;



}





function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);



if(level==1){

drawJungle();

}

else{

drawCastle();

}



}




function drawJungle(){


ctx.fillStyle="#7ddcff";
ctx.fillRect(0,0,900,400);


// clouds

ctx.fillStyle="white";

ctx.fillRect(100-camera*0.2,70,80,20);
ctx.fillRect(140-camera*0.2,55,50,30);

ctx.fillRect(500-camera*0.2,90,90,20);



// mountains

ctx.fillStyle="#65a765";

ctx.beginPath();
ctx.moveTo(0,300);
ctx.lineTo(200,100);
ctx.lineTo(400,300);
ctx.fill();



// trees

for(let i=0;i<1600;i+=200){

drawTree(i-camera,250);

}



// ground

ctx.fillStyle="#3c8c3c";
ctx.fillRect(0,350,900,50);



// rocks

ctx.fillStyle="#555";

rocks.forEach(r=>{

ctx.fillRect(r.x-camera,r.y,r.w,r.h);

});



// castle

drawCastleOutside();



drawPlayer();


}



function drawTree(x,y){

ctx.fillStyle="#5b3315";
ctx.fillRect(x+35,y,20,100);

ctx.fillStyle="#087f23";

ctx.fillRect(x,y-40,90,70);

ctx.fillRect(x+20,y-80,50,50);

}




function drawCastleOutside(){


let x=castle.x-camera;


ctx.fillStyle="#777";

ctx.fillRect(x,castle.y,castle.w,castle.h);


ctx.fillStyle="#222";

ctx.fillRect(x+45,castle.y+70,35,60);



ctx.fillStyle="#555";

ctx.fillRect(x-20,castle.y-40,40,40);
ctx.fillRect(x+100,castle.y-40,40,40);


}




function drawCastle(){


// dark room

ctx.fillStyle="#222";
ctx.fillRect(0,0,900,400);


// bricks

ctx.fillStyle="#555";

for(let x=0;x<900;x+=50){

ctx.fillRect(x,50,40,10);

}



// floor

ctx.fillStyle="#777";

ctx.fillRect(0,350,900,50);



// treasure

if(!treasure.collected){

ctx.fillStyle="gold";

ctx.fillRect(treasure.x,300,30,30);

}



// player

drawPlayer();



}




function drawPlayer(){


let x=player.x-camera;
let y=player.y;


// shadow

ctx.fillStyle="black";
ctx.fillRect(x,y+40,30,5);


// head

ctx.fillStyle="#ffcc99";
ctx.fillRect(x+8,y,15,15);


// hair

ctx.fillStyle="#552200";
ctx.fillRect(x+5,y-3,20,8);


// body

ctx.fillStyle="#ff3366";

ctx.fillRect(x+5,y+15,20,18);


// legs

ctx.fillStyle="#222";

ctx.fillRect(x+5,y+33,8,10);
ctx.fillRect(x+18,y+33,8,10);



}



function loop(){

update();
draw();

requestAnimationFrame(loop);

}


loop();


</script>

</body>
</html>
