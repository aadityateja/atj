<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Square Runner</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#eee;
    font-family:Arial;
}

canvas{
    display:block;
    margin:auto;
    background:white;
    border:3px solid black;
}

#info{
    text-align:center;
    font-size:22px;
    margin-top:15px;
}
</style>

</head>

<body>

<div id="info">
Press SPACE to Jump | R to Restart
</div>

<canvas id="game" width="900" height="300"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const ground=250;

let player={
    x:80,
    y:ground,
    w:35,
    h:35,
    vy:0,
    jumping:false
};

let gravity=1;
let jumpPower=-18;

let obstacles=[];

let frame=0;
let speed=6;
let score=0;
let gameOver=false;

function spawnObstacle(){

    obstacles.push({
        x:canvas.width,
        y:ground,
        w:25+Math.random()*20,
        h:25+Math.random()*40
    });

}

function update(){

    if(gameOver) return;

    frame++;

    score++;

    if(frame%90==0){
        spawnObstacle();
    }

    if(frame%400==0){
        speed+=0.5;
    }

    player.vy+=gravity;
    player.y+=player.vy;

    if(player.y>ground){
        player.y=ground;
        player.vy=0;
        player.jumping=false;
    }

    for(let i=0;i<obstacles.length;i++){

        obstacles[i].x-=speed;

        if(
            player.x<obstacles[i].x+obstacles[i].w &&
            player.x+player.w>obstacles[i].x &&
            player.y<obstacles[i].y+obstacles[i].h &&
            player.y+player.h>obstacles[i].y
        ){
            gameOver=true;
        }

    }

    obstacles=obstacles.filter(o=>o.x+o.w>0);

}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Sky
    ctx.fillStyle="#dff5ff";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Ground
    ctx.fillStyle="#444";
    ctx.fillRect(0,285,canvas.width,15);

    // Player
    ctx.fillStyle="red";
    ctx.fillRect(player.x,player.y-player.h,player.w,player.h);

    // Obstacles
    ctx.fillStyle="black";

    obstacles.forEach(o=>{
        ctx.fillRect(o.x,o.y-o.h,o.w,o.h);
    });

    // Score
    ctx.fillStyle="black";
    ctx.font="24px Arial";
    ctx.fillText("Score: "+score,20,35);

    if(gameOver){

        ctx.fillStyle="rgba(255,255,255,0.8)";
        ctx.fillRect(180,70,540,120);

        ctx.fillStyle="red";
        ctx.font="40px Arial";
        ctx.fillText("GAME OVER",310,125);

        ctx.font="24px Arial";
        ctx.fillText("Press R to Restart",320,165);

    }

}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}

document.addEventListener("keydown",function(e){

    if(e.code==="Space"){

        if(!player.jumping){

            player.vy=jumpPower;
            player.jumping=true;

        }

    }

    if(e.key==="r" || e.key==="R"){

        if(gameOver){

            player.y=ground;
            player.vy=0;
            player.jumping=false;

            obstacles=[];
            frame=0;
            score=0;
            speed=6;
            gameOver=false;

        }

    }

});

loop();

</script>

</body>
</html>
