<!DOCTYPE html>
<html>
<head>

<title>Jungle Castle Adventure</title>

<style>

body{
    margin:0;
    background:#111;
    text-align:center;
    font-family:Arial;
}

canvas{
    margin-top:20px;
    border:4px solid black;
    image-rendering:pixelated;
}

h2{
    color:white;
}

</style>

</head>


<body>

<h2>🌴 Jungle Castle Adventure 🏰</h2>

<p style="color:white">
Arrow Keys Move | Space Jump | Reach the Castle
</p>


<canvas id="game" width="900" height="450"></canvas>


<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let keys={};


document.addEventListener("keydown",e=>{
keys[e.code]=true;
});


document.addEventListener("keyup",e=>{
keys[e.code]=false;
});



let level=1;
let win=false;


let camera=0;



let player={

x:100,
y:300,

w:30,
h:40,

vx:0,
vy:0,

speed:5,
jump:-15,

ground:false

};



let gravity=0.8;



let frame=0;
let timer=0;



let castle={

x:2200,
y:230

};



let treasure={

x:750,
y:300,
taken:false

};



// platforms

let platforms=[

{x:300,y:330,w:120,h:20},

{x:600,y:270,w:150,h:20},

{x:950,y:320,w:120,h:20},

{x:1250,y:260,w:160,h:20},

{x:1600,y:330,w:140,h:20},

{x:1900,y:250,w:150,h:20}

];



// rocks

let rocks=[

{x:450,y:320},

{x:850,y:320},

{x:1150,y:320},

{x:1500,y:320}

];





function update(){


if(win)return;



// movement


if(keys["ArrowRight"]){

player.vx=player.speed;

}


else if(keys["ArrowLeft"]){

player.vx=-player.speed;

}

else{

player.vx=0;

}



player.x+=player.vx;




// jump


if(keys["Space"] && player.ground){

player.vy=player.jump;
player.ground=false;

}




player.vy+=gravity;

player.y+=player.vy;



player.ground=false;



// ground

if(player.y+player.h>=380){

player.y=380-player.h;
player.vy=0;
player.ground=true;

}



// platforms

platforms.forEach(p=>{


if(

player.x+player.w>p.x &&
player.x<p.x+p.w &&
player.y+player.h>=p.y &&
player.y+player.h<=p.y+20 &&
player.vy>=0

){

player.y=p.y-player.h;
player.vy=0;
player.ground=true;

}


});




// animation


if(player.vx!=0 && player.ground){

timer++;

if(timer>8){

frame++;

if(frame>2)
frame=0;

timer=0;

}


}

else{

frame=0;

}




// castle

if(player.x>castle.x){

level=2;

player.x=100;
player.y=300;

}



camera=player.x-300;

if(camera<0)
camera=0;



}




function draw(){


ctx.clearRect(0,0,900,450);



if(level==1)

drawJungle();

else

drawCastle();



}





function drawJungle(){


ctx.fillStyle="#79d8ff";
ctx.fillRect(0,0,900,450);



// sun

ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(750,70,40,0,Math.PI*2);
ctx.fill();




// mountains

ctx.fillStyle="#55aa55";

ctx.beginPath();

ctx.moveTo(0,350);
ctx.lineTo(250,100);
ctx.lineTo(500,350);

ctx.fill();



ctx.beginPath();

ctx.moveTo(400,350);
ctx.lineTo(700,120);
ctx.lineTo(1000,350);

ctx.fill();



// clouds


ctx.fillStyle="white";

ctx.fillRect(100-camera*.2,80,100,25);
ctx.fillRect(140-camera*.2,60,60,35);

ctx.fillRect(500-camera*.2,120,100,25);




// trees

for(let i=0;i<2600;i+=180){

tree(i-camera,300);

}




// ground


ctx.fillStyle="#228822";

ctx.fillRect(0,380,900,70);



// platforms


ctx.fillStyle="#654321";

platforms.forEach(p=>{

ctx.fillRect(
p.x-camera,
p.y,
p.w,
p.h
);

});




// rocks


ctx.fillStyle="#555";

rocks.forEach(r=>{

ctx.fillRect(
r.x-camera,
r.y,
35,
35
);

});



// castle


drawCastleOutside();



drawPlayer();


}
