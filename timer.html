<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dystopian Countdown</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:#050505;
    color:#ff3333;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.02) 0px,
        rgba(255,255,255,.02) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events:none;
}

.container{
    text-align:center;
    z-index:2;
}

h1{
    color:#777;
    letter-spacing:6px;
    margin-bottom:25px;
}

input{
    width:180px;
    padding:12px;
    background:#000;
    color:#ff4444;
    border:1px solid #ff4444;
    font-size:20px;
    text-align:center;
    outline:none;
}

button{
    margin:10px 5px;
    padding:12px 20px;
    background:#111;
    color:#ff4444;
    border:1px solid #ff4444;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ff4444;
    color:#000;
}

#timer{
    margin-top:40px;
    font-size:110px;
    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px darkred;
}

#message{
    margin-top:25px;
    color:white;
    letter-spacing:3px;
    font-size:24px;
}
</style>

</head>
<body>

<div class="container">

<h1>COUNTDOWN PROTOCOL</h1>

<input type="number" id="minutes" placeholder="Minutes">

<br>

<button onclick="startTimer()">START</button>
<button onclick="pauseTimer()">PAUSE</button>
<button onclick="resumeTimer()">RESUME</button>
<button onclick="resetTimer()">RESET</button>

<div id="timer">00:00</div>

<div id="message"></div>

</div>

<script>

let totalSeconds = 0;
let timer = null;
let running = false;

function updateDisplay(){

    let mins = Math.floor(totalSeconds/60);
    let secs = totalSeconds%60;

    document.getElementById("timer").innerHTML =
        String(mins).padStart(2,'0') + ":" +
        String(secs).padStart(2,'0');

}

function tick(){

    if(totalSeconds>0){

        totalSeconds--;
        updateDisplay();

    }else{

        clearInterval(timer);
        running=false;

        document.getElementById("message").innerHTML=
        "TIME HAS EXPIRED";

    }

}

function startTimer(){

    clearInterval(timer);

    let mins=parseFloat(document.getElementById("minutes").value);

    if(isNaN(mins)||mins<=0){

        alert("Enter minutes.");
        return;

    }

    totalSeconds=Math.round(mins*60);

    document.getElementById("message").innerHTML="";

    updateDisplay();

    timer=setInterval(tick,1000);

    running=true;

}

function pauseTimer(){

    if(running){

        clearInterval(timer);
        running=false;

    }

}

function resumeTimer(){

    if(!running && totalSeconds>0){

        timer=setInterval(tick,1000);
        running=true;

    }

}

function resetTimer(){

    clearInterval(timer);

    running=false;
    totalSeconds=0;

    document.getElementById("timer").innerHTML="00:00";
    document.getElementById("message").innerHTML="";
    document.getElementById("minutes").value="";

}

updateDisplay();

</script>

</body>
</html>
